templates:
  - id: deputy-2026:complaint-examples
    title: Примеры жалоб наблюдателя
    category: Жалоба
    header_template: |-
      В {{recipient}}
      От наблюдателя {{observer_name}}

      ЖАЛОБА
      УИК № {{uik_number}}
    footer_template: |-
      Прошу рассмотреть данную жалобу, принять мотивированное решение и предоставить мне его заверенную копию.

      Дата: {{date}}
      Подпись: ____________________
    checkbox_items:
      - id: voter-book-access
        label: Не дают ознакомиться с книгой избирателей
        description: Пример обращения об отказе в ознакомлении со списком избирателей.
        inserted_text: |-
          В {{time}} я обратился к председателю УИК № {{uik_number}} с просьбой предоставить мне возможность ознакомиться с книгой (списком) избирателей. В ознакомлении было отказано либо такая возможность фактически не была предоставлена.

          Обстоятельства отказа, ФИО и должность ответившего лица: ____________________.

          Прошу незамедлительно предоставить мне возможность ознакомиться со списком избирателей в пределах полномочий наблюдателя и зафиксировать рассмотрение этого обращения.
        law_references:
          - fz67:article-30:clause-9:subclause-а
      - id: home-box-opening-act-copy
        label: Не дают копию акта вскрытия ящиков надомного голосования
        description: Пример обращения о выдаче копии акта, составленного при вскрытии ящика или сейф-пакета.
        inserted_text: |-
          В {{time}} при вскрытии переносного ящика для голосования вне помещения либо соответствующего сейф-пакета был составлен акт. Я попросил предоставить мне заверенную копию этого акта, однако копия не была выдана.

          Номер ящика или сейф-пакета: ____________________.
          Наименование и дата акта, обстоятельства отказа: ____________________.

          Прошу предоставить возможность ознакомиться с актом и выдать его заверенную копию. При отказе прошу указать конкретное основание отказа в письменном решении комиссии.
        law_references:
          - fz67:article-30:clause-9
          - fz67:article-30:clause-12
      - id: home-voting-departure-marks
        label: Не вносят отметки о надомном голосовании в книгу избирателей до выезда
        description: Пример обращения об отсутствии отметок перед выездом группы.
        inserted_text: |-
          В {{time}} члены УИК № {{uik_number}} готовились к выезду для проведения голосования вне помещения. В списке избирателей напротив лиц, включённых в соответствующую выписку из реестра, до выезда не были внесены необходимые отметки о выезде членов комиссии.

          Номер переносного ящика, состав группы и сведения о выписке: ____________________.
          Каким образом установлено отсутствие отметок: ____________________.

          Прошу до выезда группы обеспечить внесение предусмотренных отметок в список избирателей и соблюдение порядка голосования вне помещения, исключающего повторную выдачу бюллетеней одним и тем же избирателям.
        law_references:
          - fz67:article-66:clause-9
      - id: turnout-figures-not-announced
        label: Не озвучивают по требованию цифры явки
        description: Пример обращения с просьбой сообщить сведения о ходе голосования.
        inserted_text: |-
          В {{time}} я обратился к председателю УИК № {{uik_number}} с просьбой сообщить имеющиеся у комиссии данные о количестве избирателей, получивших бюллетени, по состоянию на указанное время. Запрошенные цифры не были озвучены, порядок ознакомления с соответствующей информацией мне не разъяснили.

          Время запроса, запрошенный период и ответ комиссии: ____________________.

          Прошу сообщить имеющиеся данные о ходе голосования в предусмотренном порядке либо разъяснить, когда и каким способом наблюдатель может ознакомиться с ними. Прошу зафиксировать мой запрос и результаты его рассмотрения.
        law_references: []
