fz67:article-30:clause-3:
  id: fz67:article-30:clause-3
  title: "67-ФЗ: п. 3 ст. 30"
  status: source-excerpt
  text: 3. С момента начала работы участковой комиссии в день голосования, а также в дни досрочного голосования и до получения сообщения о принятии вышестоящей комиссией протокола об итогах голосования, а равно при повторном подсчете голосов избирателей, участников референдума на избирательных участках, участках референдума вправе присутствовать лица, указанные в пунктах 1 и 1.2 настоящей статьи, а также наблюдатели, иностранные (международные) наблюдатели.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 3 ст. 30; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 3 ст. 30
fz67:article-30:clause-5:
  id: fz67:article-30:clause-5
  title: "67-ФЗ: п. 5 ст. 30"
  status: source-excerpt
  text: 5. Доступ в помещение участковой комиссии, сформированной на избирательном участке, участке референдума, образованных в воинской части, закрытом административно-территориальном образовании, больнице, санатории, доме отдыха, местах содержания под стражей подозреваемых и обвиняемых, а также в помещение для голосования на этом избирательном участке, участке референдума и помещение, в котором проводится подсчет голосов избирателей, участников референдума, должен быть обеспечен всем членам участковой комиссии, лицам, указанным в пункте 1 настоящей статьи, наблюдателям.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 5 ст. 30; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 5 ст. 30
fz67:article-64:clause-1:
  id: fz67:article-64:clause-1
  title: "67-ФЗ: п. 1 ст. 64"
  status: source-excerpt
  text: 1. Время начала и окончания голосования на выборах, референдуме устанавливается законом. Продолжительность голосования не может составлять менее десяти часов. Законом может быть предусмотрено, что в случае, если при проведении выборов в органы государственной власти, референдума субъекта Российской Федерации на территории избирательного участка, участка референдума расположено место жительства (место пребывания) избирателей, участников референдума, рабочее время которых совпадает с временем голосования (при работе на предприятиях с непрерывным циклом работы или вахтовым методом), по решению избирательной комиссии субъекта Российской Федерации время начала голосования на этом избирательном участке, участке референдума может быть перенесено на более раннее время, но не более чем на два часа. При совмещении дня голосования на выборах в органы государственной власти субъекта Российской Федерации, органы местного самоуправления, на референдуме субъекта Российской Федерации, местном референдуме с днем голосования на выборах в федеральные органы государственной власти, Палату Представителей Парламента Союзного государства, на референдуме Российской Федерации время начала и окончания голосования определяется в соответствии с федеральным законом. На избирательных участках, участках референдума, образованных за пределами территории Российской Федерации, время начала и окончания голосования, его продолжительность определяются в соответствии с федеральным законом. Лицам, указанным в пункте 3 статьи 30 настоящего Федерального закона, доступ в помещения для голосования должен быть обеспечен не менее чем за один час до начала голосования.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 1 ст. 64; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 1 ст. 64
fz67:article-30:clause-7:
  id: fz67:article-30:clause-7
  title: "67-ФЗ: п. 7 ст. 30"
  status: source-excerpt
  text: 7. Полномочия наблюдателя должны быть удостоверены в направлении в письменной форме, выданном зарегистрированным кандидатом или его доверенным лицом, избирательным объединением, общественным объединением, инициативной группой по проведению референдума, субъектом общественного контроля, назначившими данного наблюдателя. В направлении указываются фамилия, имя и отчество наблюдателя, адрес его места жительства, номер избирательного участка, участка референдума, наименование комиссии, куда наблюдатель направляется, а также делается запись об отсутствии ограничений, предусмотренных пунктом 4 настоящей статьи. Указание каких-либо дополнительных сведений о наблюдателе, а в случае направления наблюдателя кандидатом, его доверенным лицом, инициативной группой по проведению референдума и проставление печати не требуются. Направление действительно при предъявлении паспорта или документа, заменяющего паспорт гражданина.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 7 ст. 30; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 7 ст. 30
fz67:article-30:clause-8:
  id: fz67:article-30:clause-8
  title: "67-ФЗ: п. 8 ст. 30"
  status: source-excerpt
  text: 8. Направление, указанное в пункте 7 настоящей статьи, должно быть представлено наблюдателем в комиссию, в которую он назначен, в день, предшествующий дню голосования (досрочного голосования), либо непосредственно в день голосования (досрочного голосования). В участковую комиссию, территориальную комиссию и окружную комиссию направление может быть представлено только наблюдателем, указанным в списке, предусмотренном пунктом 7.1 настоящей статьи, если иное не установлено федеральным законом. Установление иных, кроме указанных в настоящем Федеральном законе, ограничений, касающихся присутствия наблюдателей в помещении для голосования, наблюдения за проведением голосования, подсчетом голосов избирателей, участников референдума, составлением протоколов об итогах голосования, а также выдачи копий этих протоколов, не допускается.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 8 ст. 30; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 8 ст. 30
fz67:article-30:clause-9:subclause-к:
  id: fz67:article-30:clause-9:subclause-к
  title: "67-ФЗ: подп. «к» п. 9 ст. 30"
  status: source-excerpt
  text: к) производить в помещении для голосования (с того места, которое определено председателем участковой комиссии) фото- и (или) видеосъемку, предварительно уведомив об этом председателя, заместителя председателя или секретаря участковой комиссии.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); подп. «к» п. 9 ст. 30; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: подп. «к» п. 9 ст. 30
fz67:article-68:clause-29:
  id: fz67:article-68:clause-29
  title: "67-ФЗ: п. 29 ст. 68"
  status: source-excerpt
  text: 29. По требованию члена участковой комиссии, наблюдателя, иных лиц, указанных в пункте 3 статьи 30 настоящего Федерального закона, участковая комиссия немедленно после подписания протокола об итогах голосования (в том числе составленного повторно) обязана выдать указанным лицам заверенную копию протокола об итогах голосования. Если протокол составлен в электронном виде, его копия изготавливается путем распечатки протокола на бумажном носителе и заверяется в порядке, установленном настоящим Федеральным законом. Выдаваемые заверенные копии протоколов нумеруются. Участковая комиссия отмечает факт выдачи заверенной копии в соответствующем реестре. Лицо, получившее заверенную копию, расписывается в указанном реестре. Ответственность за соответствие в полном объеме данных, содержащихся в копии протокола об итогах голосования, данным, содержащимся в протоколе, несет лицо, заверившее указанную копию протокола. В случае, если копия протокола изготавливается без применения копировальной техники, указание в копии протокола фамилий, имен и отчеств членов участковой комиссии и проставление их подписей не требуются.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 29 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 29 ст. 68
fz67:article-64:clause-11.2:
  id: fz67:article-64:clause-11.2
  title: "67-ФЗ: п. 11.2 ст. 64"
  status: source-excerpt
  text: 11.2. При проведении голосования, подсчете голосов избирателей, участников референдума и составлении протокола участковой комиссии об итогах голосования в помещении для голосования, в помещении участковой комиссии вправе находиться лица, указанные в пункте 3 статьи 30 настоящего Федерального закона. Эти лица вправе осуществлять наблюдение как непрерывно, так и в свободно выбираемые ими промежутки времени в течение всего периода наблюдения, им обеспечивается свободный доступ в помещение (помещения), где проводятся голосование и подсчет голосов избирателей, участников референдума. Список лиц, осуществлявших наблюдение за ходом голосования и подсчетом голосов избирателей, участников референдума, составляется участковой комиссией на основе представленных данными лицами документов.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 11.2 ст. 64; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 11.2 ст. 64
fz67:article-64:clause-3:
  id: fz67:article-64:clause-3
  title: "67-ФЗ: п. 3 ст. 64"
  status: source-excerpt
  text: 3. В день голосования непосредственно перед наступлением времени голосования председатель участковой комиссии предъявляет к осмотру членам участковой комиссии, присутствующим лицам, указанным в пункте 3 статьи 30 настоящего Федерального закона, пустые ящики для голосования (соответствующие отсеки технического средства подсчета голосов - при его использовании), которые вслед за этим опечатываются печатью участковой комиссии (пломбируются), а в случае, если законом предусмотрено, что избиратель, участник референдума, которые будут находиться в день голосования вне места своего жительства, вправе подать в комиссию заявление о включении в список избирателей, участников референдума по месту своего нахождения, - также информирует о числе избирателей, участников референдума, включенных в список избирателей, участников референдума на данном избирательном участке, участке референдума, о числе избирателей, участников референдума, исключенных из списка избирателей, участников референдума в связи с подачей заявления о включении в список избирателей, участников референдума по месту своего нахождения на ином избирательном участке, участке референдума, а также о числе избирателей, участников референдума, подавших заявления о включении в список избирателей, участников референдума по месту своего нахождения на данном избирательном участке, участке референдума.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 3 ст. 64; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 3 ст. 64
cik86:clause-3.2:
  id: cik86:clause-3.2
  title: "ЦИК № 86/718-8: п. 3.2 к Положению"
  status: source-excerpt
  text: 3.2. Ежедневно до начала голосования пустые переносные ящики для голосования, пустой стационарный ящик (пустые стационарные ящики) для голосования (за исключением случая использования стационарного ящика (стационарных ящиков) для голосования для обеспечения сохранности избирательных бюллетеней в соответствии с пунктом 3.12 Положения) предъявляются лицам, присутствующим в помещении участковой избирательной комиссии (помещении для голосования), после чего они опечатываются (пломбируются).
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 3.2 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 3.2 к Положению
cik86:clause-1.9:
  id: cik86:clause-1.9
  title: "ЦИК № 86/718-8: п. 1.9 к Положению"
  status: source-excerpt
  text: |-
    1.9. Голосование в помещении проводится с использованием одного стационарного ящика для голосования (за исключением случая, указанного в абзаце втором настоящего пункта), а в последний день голосования - с использованием стационарных ящиков для голосования в количестве согласно нормативам технологического оборудования для участковых комиссий при проведении выборов, референдумов в Российской Федерации, утвержденным постановлением ЦИК России от 29 января 2014 года N 214/1405-6 (далее - нормативы).

    По решению участковой избирательной комиссии голосование в помещении (за исключением последнего дня голосования) может проводиться с использованием нескольких стационарных ящиков для голосования в количестве, не превышающем количество, указанное в нормативах.

    При проведении голосования в помещении на соответствующих избирательных участках комплексы обработки избирательных бюллетеней (далее - КОИБ) используются в соответствии с инструкциями о порядке использования КОИБ-2010 и КОИБ-2017, утвержденными ЦИК России, с учетом особенностей, предусмотренных Положением.

    Для организации голосования на дому и голосования с использованием дополнительных форм голосования используются переносные ящики для голосования, которые нумеруются. По окончании голосования на дому составляется акт (рекомендуемая форма приведена в приложении N 1).

    При этом голосование на дому проводится по месту жительства или по месту пребывания избирателя, а также в местах содержания под стражей подозреваемых и обвиняемых.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 1.9 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 1.9 к Положению
fz67:article-66:clause-8:
  id: fz67:article-66:clause-8
  title: "67-ФЗ: п. 8 ст. 66"
  status: source-excerpt
  text: |-
    8. Участковая комиссия должна располагать необходимым количеством переносных ящиков для голосования, изготовленных из прозрачного или полупрозрачного материала в соответствии с нормативами технологического оборудования, утверждаемыми Центральной избирательной комиссией Российской Федерации в соответствии с подпунктом "б" пункта 9 статьи 21 настоящего Федерального закона, для организации голосования вне помещения для голосования. Количество таких ящиков определяется решением непосредственно вышестоящей комиссии, а если при проведении выборов в органы местного самоуправления, местного референдума территория единого избирательного округа, округа референдума совпадает с территорией избирательного участка, участка референдума, - решением участковой комиссии. В случае совмещения дней голосования на выборах и (или) референдумах разных уровней решение принимается комиссией, участвующей в подготовке и проведении выборов (референдума) более высокого уровня. При этом максимальное количество используемых в день голосования переносных ящиков для голосования вне помещения для голосования на одном избирательном участке, участке референдума в зависимости от числа избирателей, участников референдума, зарегистрированных на территории избирательного участка, участка референдума, составляет:

    а) до 501 избирателя, участника референдума - 1 переносной ящик для голосования;

    б) от 501 до 1001 избирателя, участника референдума - 2 переносных ящика для голосования;

    в) более 1000 избирателей, участников референдума - 3 переносных ящика для голосования.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 8 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 8 ст. 66
fz67:article-66:clause-8.1:
  id: fz67:article-66:clause-8.1
  title: "67-ФЗ: п. 8.1 ст. 66"
  status: source-excerpt
  text: |-
    8.1. Решением соответствующей комиссии, указанной в пункте 8 настоящей статьи, количество используемых переносных ящиков для голосования вне помещения для голосования, указанное в пункте 8 настоящей статьи, может быть увеличено, но не более чем на 2 переносных ящика при наличии хотя бы одного из условий:

    а) избирательный участок, участок референдума включает территории нескольких населенных пунктов, и населенный пункт, где расположено помещение для голосования, находится вне пределов пешеходной доступности до иных населенных пунктов в течение времени голосования;

    б) на территории избирательного участка, участка референдума располагается место временного пребывания избирателей, участников референдума, где не образован избирательный участок, участок референдума;

    в) на территории избирательного участка, участка референдума в соответствии с пунктом 10 статьи 16 настоящего Федерального закона зарегистрировано более 50 избирателей, участников референдума старше 80 лет и (или) инвалидов, сведения о которых представлены в соответствии с пунктом 16.1 статьи 20 настоящего Федерального закона;

    г) при совмещении дней голосования на нескольких выборах избиратель имеет возможность проголосовать одновременно более чем по двум избирательным бюллетеням.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 8.1 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 8.1 ст. 66
cik86:clause-1.15:
  id: cik86:clause-1.15
  title: "ЦИК № 86/718-8: п. 1.15 к Положению"
  status: source-excerpt
  text: 1.15. Председатель участковой избирательной комиссии перед открытием помещения для голосования в первый день голосования информирует членов участковой избирательной комиссии, наблюдателей и иных лиц, присутствующих в помещении для голосования, о числе избирателей, включенных в список избирателей на данном избирательном участке, в том числе на основании заявлений о включении в список избирателей по месту нахождения на данном избирательном участке, о числе избирателей, исключенных из списка избирателей в связи с подачей заявлений о включении в список избирателей по месту нахождения на других избирательных участках. Такая информация также размещается на информационном стенде в помещении для голосования каждый день голосования.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 1.15 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 1.15 к Положению
fz67:article-21:clause-9:subclause-б:
  id: fz67:article-21:clause-9:subclause-б
  title: "67-ФЗ: подп. «б» п. 9 ст. 21"
  status: source-excerpt
  text: б) организует разработку нормативов технологического оборудования (кабины для голосования, ящики для голосования) для участковых комиссий, утверждает указанные нормативы и осуществляет контроль за их соблюдением, а также организует закупку этого технологического оборудования при проведении выборов в федеральные органы государственной власти, референдума Российской Федерации;
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); подп. «б» п. 9 ст. 21; КонсультантПлюс, получено 02.10.2026
  sourceIds:
