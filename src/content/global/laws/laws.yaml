cik86:clause-5.2:
  id: cik86:clause-5.2
  title: "ЦИК № 86/718-8: п. 5.2 к Положению"
  status: source-excerpt
  text: 5.2. По истечении времени голосования в каждый день голосования, за исключением последнего, неиспользованные избирательные бюллетени, список избирателей и иная избирательная документация убираются в отдельный сейф. При этом не допускается хранение указанной избирательной документации в сейфе (металлическом шкафу, металлическом ящике), предназначенном для хранения сейф-пакетов.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 5.2 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 5.2 к Положению
cik86:clause-3.14:
  id: cik86:clause-3.14
  title: "ЦИК № 86/718-8: п. 3.14 к Положению"
  status: source-excerpt
  text: 3.14. По истечении времени голосования каждый день голосования, за исключением последнего, и после осуществления членами участковой избирательной комиссии действий по обеспечению сохранности избирательных бюллетеней работа участковой избирательной комиссии в этот день заканчивается. Все присутствующие лица покидают помещение для голосования, после чего помещение для голосования закрывается, опечатывается (за исключением случаев, когда конструктивные особенности помещения не позволяют этого сделать) и передается под круглосуточную охрану сотрудникам правоохранительных органов, иным уполномоченным лицам.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 3.14 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 3.14 к Положению
cik86:clause-3.15:
  id: cik86:clause-3.15
  title: "ЦИК № 86/718-8: п. 3.15 к Положению"
  status: source-excerpt
  text: |-
    3.15. Члены участковой избирательной комиссии, наблюдатели, иные лица, имеющие право присутствовать в помещении для голосования, вправе осуществлять контроль за обеспечением сохранности избирательных бюллетеней с учетом правил охраны (режима работы) объекта, в котором расположено помещение для голосования.

    В каждый день голосования, за исключением последнего, после опечатывания помещения для голосования доступ в это помещение запрещается.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 3.15 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 3.15 к Положению
fz67:article-68:clause-2:
  id: fz67:article-68:clause-2
  title: "67-ФЗ: п. 2 ст. 68"
  status: source-excerpt
  text: 2. Подсчет голосов избирателей, участников референдума начинается сразу после окончания времени голосования и проводится без перерыва до установления итогов голосования, о которых должны быть извещены все члены участковой комиссии, а также наблюдатели. В случае совмещения выборов разных уровней в первую очередь осуществляется подсчет голосов по выборам в федеральные органы государственной власти, затем - в органы государственной власти субъекта Российской Федерации, затем - в органы местного самоуправления.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 2 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 2 ст. 68
fz67:article-68:clause-10:
  id: fz67:article-68:clause-10
  title: "67-ФЗ: п. 10 ст. 68"
  status: source-excerpt
  text: 10. Непосредственный подсчет голосов избирателей, участников референдума производится в специально отведенных местах, оборудованных таким образом, чтобы к ним был обеспечен доступ членов комиссии с правом решающего голоса. Членам комиссии с правом решающего голоса, кроме председателя (заместителя председателя) и секретаря комиссии, запрещается при подсчете голосов пользоваться письменными принадлежностями, за исключением случаев, предусмотренных пунктами 12, 16 и 17 настоящей статьи. Лицам, присутствующим при непосредственном подсчете голосов, должен быть обеспечен полный обзор действий членов комиссии.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 10 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 10 ст. 68
fz67:article-68:clause-1:
  id: fz67:article-68:clause-1
  title: "67-ФЗ: п. 1 ст. 68"
  status: source-excerpt
  text: 1. Подсчет голосов избирателей, участников референдума осуществляется открыто и гласно с оглашением и соответствующим оформлением в увеличенной форме протокола об итогах голосования последовательно всех результатов выполняемых действий по подсчету бюллетеней и голосов избирателей, участников референдума членами участковой комиссии с правом решающего голоса. Лицам, указанным в пункте 3 статьи 30 настоящего Федерального закона, должна быть предоставлена возможность присутствовать при подсчете голосов избирателей, участников референдума и наблюдать за подсчетом.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 1 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 1 ст. 68
fz67:article-30:clause-9:subclause-г:
  id: fz67:article-30:clause-9:subclause-г
  title: "67-ФЗ: подп. «г» п. 9 ст. 30"
  status: source-excerpt
  text: г) наблюдать за подсчетом числа граждан, внесенных в списки избирателей, участников референдума, бюллетеней, выданных избирателям, участникам референдума, погашенных бюллетеней; наблюдать за подсчетом голосов избирателей, участников референдума на избирательном участке, участке референдума на расстоянии и в условиях, обеспечивающих им обозримость содержащихся в бюллетенях отметок избирателей, участников референдума; знакомиться с любым заполненным или незаполненным бюллетенем при подсчете голосов избирателей, участников референдума; наблюдать за составлением комиссией протокола об итогах голосования и иных документов в период, указанный в пункте 3 настоящей статьи;
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); подп. «г» п. 9 ст. 30; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: подп. «г» п. 9 ст. 30
fz67:article-68:clause-4:
  id: fz67:article-68:clause-4
  title: "67-ФЗ: п. 4 ст. 68"
  status: source-excerpt
  text: 4. Председатель, заместитель председателя или секретарь участковой комиссии уточняет, оглашает и вносит в строку 2 протокола об итогах голосования и его увеличенной формы число бюллетеней, полученных участковой комиссией (данные о бюллетенях, извлеченных из конвертов досрочно проголосовавших в помещении территориальной комиссии (избирательной комиссии, организующей подготовку и проведение выборов в органы местного самоуправления, местного референдума, окружной избирательной комиссии) избирателей, участников референдума, в указанное число не входят). При использовании технических средств подсчета голосов полученные данные после их оглашения вносятся в строку 2 увеличенной формы протокола об итогах голосования.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 4 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 4 ст. 68
fz67:article-68:clause-5:
  id: fz67:article-68:clause-5
  title: "67-ФЗ: п. 5 ст. 68"
  status: source-excerpt
  text: |-
    5. Перед непосредственным подсчетом голосов избирателей, участников референдума члены участковой комиссии с правом решающего голоса вносят в каждую страницу списка избирателей, участников референдума следующие суммарные данные по этой странице:

    а) число избирателей, участников референдума, внесенных в список избирателей, участников референдума на момент окончания голосования (без учета числа выбывших избирателей, участников референдума);

    б) число бюллетеней, выданных избирателям, участникам референдума в помещении для голосования в день голосования (устанавливается по числу подписей избирателей, участников референдума в списке избирателей, участников референдума);

    в) число бюллетеней, выданных избирателям, участникам референдума, проголосовавшим вне помещения для голосования в день голосования (устанавливается по числу соответствующих отметок в списке избирателей, участников референдума);

    г) число бюллетеней, выданных досрочно проголосовавшим избирателям, участникам референдума (устанавливается по числу соответствующих отметок в списке избирателей, участников референдума; число избирателей, участников референдума, досрочно проголосовавших в помещении территориальной комиссии, избирательной комиссии, организующей подготовку и проведение выборов в органы местного самоуправления, местного референдума, окружной избирательной комиссии, проверяется по списку досрочно проголосовавших избирателей, участников референдума);

    д) - е) утратили силу. - Федеральный закон от 29.05.2023 N 184-ФЗ.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 5 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 5 ст. 68
fz67:article-68:clause-6:
  id: fz67:article-68:clause-6
  title: "67-ФЗ: п. 6 ст. 68"
  status: source-excerpt
  text: |-
    6. После внесения указанных в пункте 5 настоящей статьи данных каждая страница списка избирателей, участников референдума подписывается внесшим эти данные членом комиссии, который затем их суммирует, оглашает и сообщает председателю, заместителю председателя или секретарю участковой комиссии и лицам, присутствующим при подсчете голосов. Итоговые данные, определяемые как сумма данных, установленных в соответствии с пунктом 5 настоящей статьи, председатель, заместитель председателя или секретарь участковой комиссии оглашает, вносит в последнюю страницу списка избирателей, участников референдума, подтверждает своей подписью и заверяет печатью участковой комиссии. Оглашенные данные вносятся в соответствующие строки протокола об итогах голосования и его увеличенной формы, а в случае использования технических средств подсчета голосов - только в соответствующие строки увеличенной формы протокола:

    а) в строку 1 - число избирателей, участников референдума, внесенных в список избирателей, участников референдума на момент окончания голосования;

    б) в строки 3 и 4 - число бюллетеней, выданных избирателям, участникам референдума, проголосовавшим досрочно;

    в) в строку 5 - число бюллетеней, выданных избирателям, участникам референдума, проголосовавшим в помещении для голосования в день голосования;

    г) в строку 6 - число бюллетеней, выданных избирателям, участникам референдума, проголосовавшим вне помещения для голосования в день голосования;

    д) - и) утратили силу. - Федеральный закон от 29.05.2023 N 184-ФЗ.

    Абзацы одиннадцатый - тринадцатый утратили силу. - Федеральный закон от 29.05.2023 N 184-ФЗ.

    После этого со списком избирателей, участников референдума вправе ознакомиться наблюдатели и иные лица, указанные в пункте 3 статьи 30 настоящего Федерального закона.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 6 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 6 ст. 68
fz67:article-68:clause-7:
  id: fz67:article-68:clause-7
  title: "67-ФЗ: п. 7 ст. 68"
  status: source-excerpt
  text: 7. Дальнейшая работа со списком избирателей, участников референдума не может проводиться до проверки контрольных соотношений данных, внесенных в протокол об итогах голосования в соответствии с пунктом 22 настоящей статьи. Список избирателей, участников референдума на это время убирается в сейф либо иное специально приспособленное для хранения документов место. Хранение списка избирателей, участников референдума, исключающее доступ к нему лиц, находящихся в помещении для голосования, обеспечивается председателем или секретарем участковой комиссии.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 7 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 7 ст. 68
fz67:article-68:clause-12:
  id: fz67:article-68:clause-12
  title: "67-ФЗ: п. 12 ст. 68"
  status: source-excerpt
  text: 12. В первую очередь производится подсчет бюллетеней, находившихся в переносных ящиках для голосования. Вскрытию переносных ящиков для голосования предшествует проверка неповрежденности печатей (пломб) на них. Подсчет ведется таким образом, чтобы не нарушалась тайна голосования. Число извлеченных бюллетеней установленной формы оглашается и вносится в строку 8 протокола об итогах голосования и его увеличенной формы. Если число бюллетеней установленной формы, обнаруженных в переносном ящике для голосования, больше количества заявлений избирателей, участников референдума, содержащих отметку о числе полученных бюллетеней, все бюллетени для голосования по соответствующему избирательному округу, округу референдума, находившиеся в данном переносном ящике для голосования, решением участковой комиссии признаются недействительными, о чем составляется акт, который прилагается к протоколу об итогах голосования и в котором указываются фамилии и инициалы членов участковой комиссии, обеспечивавших проведение голосования вне помещения для голосования с использованием данного переносного ящика для голосования. Число признанных в этом случае недействительными бюллетеней оглашается, вносится в указанный акт и впоследствии суммируется с числом недействительных бюллетеней, выявленных при сортировке бюллетеней. На лицевой стороне каждого из этих бюллетеней, на квадратах, расположенных справа от данных баллотирующихся кандидатов (списков кандидатов), а на выборах в органы местного самоуправления также от позиции "Против всех кандидатов" ("Против всех списков кандидатов"), на квадратах, относящихся к позициям "Да" и "Нет" ("За" и "Против"), вносится запись о причине признания бюллетеня недействительным, которая подтверждается подписями двух членов участковой комиссии с правом решающего голоса и заверяется печатью участковой комиссии, а сами бюллетени при непосредственном подсчете голосов упаковываются отдельно, опечатываются и при дальнейшем подсчете не учитываются.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 12 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 12 ст. 68
cik86:clause-4.2:
  id: cik86:clause-4.2
  title: "ЦИК № 86/718-8: п. 4.2 к Положению"
  status: source-excerpt
  text: 4.2. В первую очередь осуществляется вскрытие переносных ящиков для голосования с избирательными бюллетенями, которые заполнили досрочно проголосовавшие избиратели (в соответствии с абзацем первым пункта 1 статьи 65 Федерального закона N 67-ФЗ), а также избиратели, проголосовавшие на дому в последний день голосования. Соответствующие действия осуществляются в порядке, установленном пунктом 12 статьи 68 Федерального закона N 67-ФЗ.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 4.2 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 4.2 к Положению
cik86:clause-4.3:
  id: cik86:clause-4.3
  title: "ЦИК № 86/718-8: п. 4.3 к Положению"
  status: source-excerpt
  text: 4.3. Затем производится подсчет избирательных бюллетеней, извлеченных из переносных ящиков для голосования и помещенных в сейф-пакеты в соответствии с пунктом 3.3 Положения. Подсчет ведется таким образом, чтобы не нарушалась тайна голосования.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 4.3 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 4.3 к Положению
cik86:clause-4.4:
  id: cik86:clause-4.4
  title: "ЦИК № 86/718-8: п. 4.4 к Положению"
  status: source-excerpt
  text: |-
    4.4. Вскрытию каждого сейф-пакета предшествует проверка его неповрежденности (отсутствия следов несанкционированного доступа к его содержимому), указанная в пункте 3.10 Положения, а также установление факта идентичности номера на сейф-пакете номеру, указанному в соответствующем акте, факта идентичности номера на защитной марке номеру, указанному в соответствующем акте (в случае использования защитной марки).

    В случае наличия повреждений (следов несанкционированного доступа к содержимому) или иных нарушений целостности (идентичности) сейф-пакета или индикаторной ленты, а также расхождения номера сейф-пакета и номера, указанного в соответствующем акте, расхождения номера на защитной марке и номера, указанного в соответствующем акте (в случае использования защитной марки), данные факты подлежат незамедлительному рассмотрению участковой избирательной комиссией с составлением соответствующего акта и информированием вышестоящей избирательной комиссии.

    Основанием для принятия решения о признании всех избирательных бюллетеней, находящихся в соответствующем сейф-пакете, недействительными может являться:

    отсутствие или нарушение целостности индикаторной ленты;

    факт вскрытия сейф-пакета до начала проверки, указанной в абзаце первом настоящего пункта;

    расхождение номера сейф-пакета и номера, указанного в соответствующем акте;

    расхождение номера защитной марки и номера, указанного в соответствующем акте (в случае использования защитной марки);

    отсутствие или повреждение наклеенной на сейф-пакет защитной марки (в случае использования защитной марки);

    наличие на сейф-пакете различных следов, позволяющих сделать вывод о несанкционированном доступе к его содержимому, или иных нарушений его целостности (идентичности).

    Решение о признании всех избирательных бюллетеней, находящихся в соответствующем сейф-пакете, недействительными принимается участковой избирательной комиссией при наличии указанных оснований при условии, что они не позволяют с достоверностью определить результаты волеизъявления избирателей.

    (п. 4.4 в ред. Постановления ЦИК России от 28.12.2023 N 145/1128-8)
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 4.4 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 4.4 к Положению
cik86:clause-4.5:
  id: cik86:clause-4.5
  title: "ЦИК № 86/718-8: п. 4.5 к Положению"
  status: source-excerpt
  text: 4.5. Число извлеченных из сейф-пакета избирательных бюллетеней установленной формы оглашается и вносится в акт, составленный в отношении этого сейф-пакета в соответствии с пунктом 3.5 Положения.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 4.5 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 4.5 к Положению
cik86:clause-4.6:
  id: cik86:clause-4.6
  title: "ЦИК № 86/718-8: п. 4.6 к Положению"
  status: source-excerpt
  text: |-
    4.6. Если число избирательных бюллетеней установленной формы по соответствующему виду выборов (соответствующему избирательному округу), обнаруженных в сейф-пакете, больше указанного в соответствующем акте количества избирателей, получивших избирательные бюллетени, проводится проверка:

    для сейф-пакетов с избирательными бюллетенями из переносных ящиков для голосования избирателей, проголосовавших на дому, - согласно письменным заявлениям о голосовании на дому;

    для сейф-пакетов с избирательными бюллетенями из переносных ящиков для голосования избирателей, проголосовавших с использованием соответствующей дополнительной формы голосования, - по книге списка избирателей, содержащей сведения об избирателях, проголосовавших с использованием соответствующей дополнительной формы голосования.

    С этой целью список избирателей на время проверки извлекается из места хранения, а по ее окончании убирается обратно в сейф либо иное специально приспособленное для хранения документов место. При этом не допускается хранение списка избирателей в сейфе (металлическом шкафу, металлическом ящике), предназначенном для хранения сейф-пакетов. Сохранность списка избирателей обеспечивается в соответствии с разделом 5 Положения.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 4.6 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 4.6 к Положению
cik86:clause-4.10:
  id: cik86:clause-4.10
  title: "ЦИК № 86/718-8: п. 4.10 к Положению"
  status: source-excerpt
  text: |-
    4.10. Вскрытие сейф-пакета (сейф-пакетов), содержащего (содержащих) избирательные бюллетени, перемещенные из стационарного ящика (стационарных ящиков) для голосования в соответствии с пунктом 3.11 Положения, осуществляется перед вскрытием стационарных ящиков для голосования, которые использовались в последний день голосования, в порядке, установленном пунктами 4.4 и 4.5 Положения.

    Если число избирательных бюллетеней установленной формы по соответствующему виду выборов (соответствующему избирательному округу), обнаруженных в сейф-пакете, больше указанного в соответствующем акте количества избирателей, получивших избирательные бюллетени, проводится проверка количества избирательных бюллетеней по всему списку избирателей с учетом абзаца четвертого пункта 4.6 Положения.

    Если в ходе указанной проверки выяснится, что число избирательных бюллетеней установленной формы по соответствующему виду выборов (соответствующему избирательному округу), обнаруженных в сейф-пакете (сейф-пакетах), больше количества избирателей, получивших избирательные бюллетени, указанного в соответствующем акте, составляется акт (рекомендуемая форма приведена в приложении N 6), который прилагается к первому экземпляру протокола об итогах голосования. Данное обстоятельство подлежит рассмотрению участковой избирательной комиссией с информированием непосредственно вышестоящей избирательной комиссии. При этом в случае невозможности достоверно определить результаты волеизъявления избирателей участковая избирательная комиссия принимает решение о признании всех избирательных бюллетеней по соответствующему избирательному округу, обнаруженных в сейф-пакете (сейф-пакетах), недействительными.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 4.10 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 4.10 к Положению
fz67:article-68:clause-13:
  id: fz67:article-68:clause-13
  title: "67-ФЗ: п. 13 ст. 68"
  status: source-excerpt
  text: 13. Стационарные ящики для голосования вскрываются после проверки неповрежденности печатей (пломб) на них.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 13 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 13 ст. 68
fz67:article-68:clause-14:
  id: fz67:article-68:clause-14
  title: "67-ФЗ: п. 14 ст. 68"
  status: source-excerpt
  text: 14. Члены участковой комиссии сортируют избирательные бюллетени, извлеченные из переносных и стационарных ящиков для голосования, по голосам, поданным за каждого из кандидатов (каждый список кандидатов), а на выборах в органы местного самоуправления также по голосам, поданным против всех кандидатов (против всех списков кандидатов), по голосам, поданным по позициям "Да" и "Нет" ("За" и "Против"), содержащимся в бюллетене для голосования на референдуме, одновременно отделяют бюллетени неустановленной формы и недействительные бюллетени. При сортировке бюллетеней члены участковой комиссии с правом решающего голоса оглашают содержащиеся в каждом из них отметки избирателя, участника референдума и представляют бюллетени для визуального контроля всем лицам, присутствующим при непосредственном подсчете голосов. Одновременное оглашение содержания двух и более бюллетеней не допускается.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 14 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
