cik86:clause-3.11:
  id: cik86:clause-3.11
  title: "ЦИК № 86/718-8: п. 3.11 к Положению"
  status: source-excerpt
  text: |-
    3.11. Каждый день голосования, за исключением последнего, избирательные бюллетени из стационарного ящика (стационарных ящиков) для голосования перемещаются в сейф-пакет (сейф-пакеты) незамедлительно по окончании голосования в помещении для голосования. В случае если сейф-пакет не вмещает количество избирательных бюллетеней, извлеченных из стационарного ящика (стационарных ящиков) для голосования, для этих целей допускается использование нескольких сейф-пакетов.

    Перемещение избирательных бюллетеней из стационарного ящика (стационарных ящиков) для голосования в сейф-пакет (сейф-пакеты) и их хранение осуществляется в порядке, аналогичном порядку перемещения избирательных бюллетеней из переносного ящика для голосования в сейф-пакет (сейф-пакеты) (пункты 3.5 - 3.10 Положения), с составлением акта (рекомендуемая форма приведена в приложении N 2), который хранится вместе с сейф-пакетом. В случае использования нескольких сейф-пакетов в отношении них составляется один акт, и при этом указываются номера всех сейф-пакетов.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 3.11 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 3.11 к Положению
cik86:annex-2:
  id: cik86:annex-2
  title: "ЦИК № 86/718-8: Приложение 2 к Положению"
  status: source-excerpt
  text: |-
    Приложение N 2

    к Положению об особенностях

    голосования, установления итогов

    голосования в случае принятия

    решения о проведении голосования

    на выборах, референдумах в течение

    нескольких дней подряд

    АКТ

    о проведении голосования с использованием стационарного ящика для голосования и сейф-пакета

    _________________________________________________________

    (наименование выборов, при совмещении - всех выборов)

    Мы, нижеподписавшиеся члены участковой избирательной комиссии избирательного участка N ____, составили акт о том, что "__" ______________ 20__ года в __ час. __ мин. в помещении участковой избирательной комиссии присутствующим был предъявлен пустой стационарный ящик (пустые стационарные ящики) для голосования N ___ (N ___, N ___), который затем был опечатан и использован (которые затем были опечатаны и использованы) при проведении голосования в помещении для голосования.

    Количество избирателей, получивших избирательные бюллетени, -

    ________________________________________.

    (число цифрами и прописью)

    По завершении голосования с использованием стационарного ящика (стационарных ящиков) для голосования N ___ (N ___, N ___) избирательные бюллетени были перемещены в сейф-пакет N ____ с наклеенной на него защитной маркой N ____, который запечатан <*>.

    "__" __________ 20__ года

    __ час. __ мин.

    Члены участковой избирательной комиссии, проводившие голосование:

    МП	(подпись)		(инициалы, фамилия)

    (подпись)		(инициалы, фамилия)

    Лица, присутствовавшие

    при проведении голосования:

    (подпись)		(инициалы, фамилия)

    (подпись)		(инициалы, фамилия)

    При   подсчете   голосов   избирателей   число  избирательных

    бюллетеней   установленной  формы,   обнаруженных   при  вскрытии

    сейф-пакета N ___ с наклеенной на него защитной маркой N ___ <*>,

    - ____________________________________ <**>.

    (число цифрами и прописью)

    "__" __________ 20__ года

    __ час. __ мин.

    Члены участковой избирательной комиссии:

    (подпись)		(инициалы, фамилия)

    МП

    (подпись)		(инициалы, фамилия)

    --------------------------------

    <*> Номер защитной марки указывается в акте только в случае ее использования. В случае если сейф-пакет не вмещает количество избирательных бюллетеней, извлеченных из стационарного ящика для голосования (в том числе при использовании нескольких стационарных ящиков для голосования), для этих целей допускается использование нескольких сейф-пакетов. При этом указываются номера всех сейф-пакетов и всех защитных марок.

    <**> В случае использования нескольких сейф-пакетов число избирательных бюллетеней установленной формы, обнаруженных при вскрытии сейф-пакетов, не должно превышать количество избирательных бюллетеней, выданных избирателям. При этом указывается число избирательных бюллетеней установленной формы, обнаруженных при вскрытии всех сейф-пакетов.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); Приложение 2 к Положению
