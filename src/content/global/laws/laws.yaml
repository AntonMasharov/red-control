      label: Оригинал документа
      locator: подп. «б» п. 9 ст. 21
fz67:article-54:clause-10:
  id: fz67:article-54:clause-10
  title: "67-ФЗ: п. 10 ст. 54"
  status: source-excerpt
  text: 10. Запрещается размещать агитационные материалы на памятниках, обелисках, зданиях, сооружениях и в помещениях, имеющих историческую, культурную или архитектурную ценность. Запрещается размещать агитационные материалы в зданиях, в которых размещены избирательные комиссии, помещения для голосования, и на расстоянии менее 50 метров от входа в них.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 10 ст. 54; КонсультантПлюс, получено 02.10.2026
  sourceIds:
