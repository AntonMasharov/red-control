fz67:article-66:clause-13:
  id: fz67:article-66:clause-13
  title: "67-ФЗ: п. 13 ст. 66"
  status: source-excerpt
  text: '13. Серия и номер паспорта или документа, заменяющего паспорт, избирателя, участника референдума, проголосовавших вне помещения для голосования, вносятся в список избирателей, участников референдума членами участковой комиссии с правом решающего голоса, выезжавшими по заявлениям (устным обращениям) избирателей, участников референдума. Одновременно в соответствующей графе (графах) списка избирателей, участников референдума делается особая отметка: "Голосовал вне помещения для голосования", а также ставятся подписи указанных членов комиссии.'
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 13 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 13 ст. 66
cik86:clause-1.11:
  id: cik86:clause-1.11
  title: "ЦИК № 86/718-8: п. 1.11 к Положению"
  status: source-excerpt
  text: |-
    1.11. Перед выездом для проведения голосования на дому членам участковой избирательной комиссии рекомендуется убедиться в том, что избиратель будет находиться по указанному им адресу.

    Выезжавшие для проведения голосования на дому члены участковой избирательной комиссии по прибытии в помещение для голосования в списке избирателей в графе "Особые отметки" дополнительно указывают дату получения избирателем избирательного бюллетеня.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 1.11 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 1.11 к Положению
cik86:clause-3.8:
  id: cik86:clause-3.8
  title: "ЦИК № 86/718-8: п. 3.8 к Положению"
  status: source-excerpt
  text: |-
    3.8. После этого сейф-пакет, составленный в отношении него акт, а также заявления избирателей о предоставлении возможности проголосовать на дому помещаются в отдельный сейф (металлический шкаф, металлический ящик) участковой избирательной комиссии, предназначенный для хранения сейф-пакетов. Хранение в таком сейфе (металлическом шкафу, металлическом ящике) иной документации не допускается.

    Сейф-пакет не вскрывается до начала подсчета голосов избирателей.

    Места хранения сейф-пакетов должны круглосуточно находиться под видеонаблюдением (видеофиксацией).

    Избирательным комиссиям в целях контроля за сохранностью упакованных в сейф-пакеты избирательных бюллетеней в случае, если не применяются средства видеонаблюдения либо места хранения сейф-пакетов находятся вне зоны видеонаблюдения, рекомендуется использовать (в том числе в нерабочее и ночное время) средства видеофиксации, обладающие необходимым размером памяти (емкостью) и возможностью осуществлять видеонаблюдение (видеофиксацию) в отсутствие освещения (в режиме ночной съемки).

    Такие устройства предоставляются по заявкам избирательных комиссий органами государственной власти, органами местного самоуправления в рамках установленной законом обязанности по оказанию избирательным комиссиям содействия в реализации их полномочий, а также вышестоящими избирательными комиссиями.

    В случае если указанные устройства не обладают возможностью осуществлять видеонаблюдение (видеофиксацию) в отсутствие освещения (в режиме ночной съемки), то в зоне видеонаблюдения (видеофиксации) мест хранения сейф-пакетов должно быть организовано освещение.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 3.8 к Положению
