    Дата и время проведения голосования: "__" __________ 20__ года с __ ч. __ мин. по __ ч. __ мин.

    Наименование выборов	Количество <**> бюллетеней, выданных членам УИК для проведения голосования вне помещения для голосования	Количество <**> письменных заявлений избирателей о предоставлении им возможности проголосовать вне помещения для голосования	Количество <**> избирательных бюллетеней, выданных избирателям	Количество <**> возвращенных (неиспользованных, испорченных избирателями) избирательных бюллетеней <***>

    (на выборах депутатов Государственной Думы Федерального Собрания Российской Федерации в том числе указывается избирательный округ)

