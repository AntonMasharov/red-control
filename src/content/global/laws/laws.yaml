    <*> При проведении голосования в последний день голосования слова "и сейф-пакета" в наименовании акта не указываются.

    <**> Количество указывается цифрами и прописью.

    <***> Испорченные и неиспользованные избирательные бюллетени возвращаются в УИК.

    <****> Номер защитной марки указывается в акте только в случае ее использования. В случае если сейф-пакет не вмещает количество избирательных бюллетеней, извлеченных из переносного ящика для голосования, для этих целей допускается использование второго сейф-пакета. При этом указываются номера обоих сейф-пакетов и обеих защитных марок.

