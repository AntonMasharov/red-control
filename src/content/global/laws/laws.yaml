cik86:clause-3.3:
  id: cik86:clause-3.3
  title: "ЦИК № 86/718-8: п. 3.3 к Положению"
  status: source-excerpt
  text: |-
    3.3. Каждый день голосования, за исключением последнего, избирательные бюллетени из переносного ящика для голосования, использовавшегося при проведении голосования в какой-либо из форм голосования, перемещаются в сейф-пакет.

    Для каждого переносного ящика для голосования используется отдельный сейф-пакет, который запечатывается.

    В случае если сейф-пакет не вмещает количество избирательных бюллетеней, извлеченных из переносного ящика для голосования, для этих целей допускается использование второго сейф-пакета.

    Перемещение избирательных бюллетеней из переносного ящика для голосования в сейф-пакет осуществляется незамедлительно по возвращении в помещение для голосования членов участковой избирательной комиссии, проводивших голосование с данным ящиком.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 3.3 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 3.3 к Положению
cik86:clause-3.5:
  id: cik86:clause-3.5
  title: "ЦИК № 86/718-8: п. 3.5 к Положению"
  status: source-excerpt
  text: |-
    3.5. Перемещение избирательных бюллетеней в сейф-пакет осуществляется членами участковой избирательной комиссии с правом решающего голоса без подсчета избирательных бюллетеней с сохранением тайны голосования.

    После перемещения избирательных бюллетеней сейф-пакет незамедлительно запечатывается с использованием индикаторной ленты.

    На сейф-пакете, но вне индикаторной ленты, после его запечатывания ставятся подписи не менее двух членов участковой избирательной комиссии с правом решающего голоса, наблюдателей (по их желанию).

    В отношении каждого сейф-пакета составляется акт (рекомендуемые формы приведены в приложениях N 1, N 1.1), который хранится вместе с сейф-пакетом. В случае использования двух сейф-пакетов в отношении них составляется один акт, и при этом указываются номера обоих сейф-пакетов.

    С указанным актом вправе ознакомиться члены участковой избирательной комиссии с правом решающего голоса, наблюдатели.

    Указанные лица вправе по желанию получить заверенную копию такого акта. При этом заверение выдаваемых копий осуществляется председателем, или заместителем председателя, или секретарем участковой избирательной комиссии. Лицо, заверяющее копию акта, на указанной копии делает запись: "Верно" или "Копия верна", расписывается, указывает свои фамилию и инициалы, дату и время заверения копии и проставляет печать участковой избирательной комиссии.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 3.5 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 3.5 к Положению
cik86:clause-3.6:
  id: cik86:clause-3.6
  title: "ЦИК № 86/718-8: п. 3.6 к Положению"
  status: source-excerpt
  text: |-
    3.6. Перемещение избирательных бюллетеней из переносного ящика для голосования в сейф-пакет производится в помещении для голосования.

    При перемещении избирательных бюллетеней в сейф-пакет вправе присутствовать:

    члены участковой избирательной комиссии и наблюдатели, присутствовавшие (выезжавшие) при проведении голосования с использованием переносного ящика для голосования;

    члены участковой избирательной комиссии и наблюдатели, находящиеся в этот момент в помещении для голосования;

    иные лица, имеющие право присутствовать в помещении для голосования.

    Если к моменту перемещения избирательных бюллетеней из переносного ящика для голосования в сейф-пакет указанные лица отсутствуют, то такое отсутствие не является препятствием для перемещения избирательных бюллетеней из переносного ящика для голосования в сейф-пакет.

    Перед перемещением избирательных бюллетеней из переносного ящика для голосования члены участковой избирательной комиссии демонстрируют присутствующим лицам, что используемый сейф-пакет является пустым.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 3.6 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 3.6 к Положению
cik86:clause-3.7:
  id: cik86:clause-3.7
  title: "ЦИК № 86/718-8: п. 3.7 к Положению"
  status: source-excerpt
  text: |-
    3.7. Перемещение избирательных бюллетеней из переносного ящика для голосования в сейф-пакет необходимо осуществлять в зоне видеонаблюдения.

    В случае если средства видеонаблюдения не применяются, необходимо использовать средства видеофиксации (устройства стационарного или подвижного типа, предназначенные для записи, хранения и воспроизведения видеоинформации).

    При этом порядок применения средств видеофиксации устанавливается избирательной комиссией, организующей выборы, с учетом утвержденных ЦИК России рекомендаций по применению в участковых и территориальных избирательных комиссиях средств видеорегистрации (видеофиксации) при проведении выборов депутатов Государственной Думы Федерального Собрания Российской Федерации девятого созыва, а также пункта 3.8 Положения.

    Наблюдатели, представители средств массовой информации при перемещении избирательных бюллетеней в сейф-пакет вправе с использованием фото- и (или) видеоаппаратуры запечатлеть факт запечатывания сейф-пакета и составления в отношении данного сейф-пакета акта.

    Факт запечатывания сейф-пакета и составления акта с использованием фото- и (или) видеоаппаратуры также может быть зафиксирован членами участковой избирательной комиссии.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 3.7 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 3.7 к Положению
