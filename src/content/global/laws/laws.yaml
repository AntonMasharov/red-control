      locator: п. 17 ст. 66
fz67:article-66:clause-12:
  id: fz67:article-66:clause-12
  title: "67-ФЗ: п. 12 ст. 66"
  status: source-excerpt
  text: 12. Члены участковой комиссии, выехавшие по заявлениям (устным обращениям) избирателей, участников референдума, вправе выдать бюллетени только тем избирателям, участникам референдума, заявления (устные обращения) которых зарегистрированы в реестре в соответствии с пунктом 2 настоящей статьи.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 12 ст. 66; КонсультантПлюс, получено 02.10.2026
