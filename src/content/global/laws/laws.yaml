  status: source-excerpt
  text: а) знакомиться со списками избирателей, участников референдума, в том числе составленными в электронном виде, реестром заявлений (обращений) о голосовании вне помещения для голосования;
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); подп. «а» п. 9 ст. 30; КонсультантПлюс, получено 02.10.2026
