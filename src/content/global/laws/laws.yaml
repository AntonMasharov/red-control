    <******> В случае использования двух сейф-пакетов число избирательных бюллетеней установленной формы, обнаруженных при вскрытии сейф-пакетов, не должно превышать количество избирательных бюллетеней, выданных избирателям. При этом указывается число избирательных бюллетеней установленной формы, обнаруженных при вскрытии обоих сейф-пакетов.
