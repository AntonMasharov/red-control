      label: Оригинал документа
      locator: п. 10 ст. 54
fz67:article-61:clause-12:
  id: fz67:article-61:clause-12
  title: "67-ФЗ: п. 12 ст. 61"
  status: source-excerpt
  text: 12. При оборудовании помещения для голосования должны обеспечиваться предусмотренные законодательством Российской Федерации условия для беспрепятственного доступа к данному помещению избирателей, участников референдума, являющихся инвалидами, и голосования в нем. При проведении голосования осуществляется оказание помощи таким лицам в целях реализации ими активного избирательного права с соблюдением требований, предусмотренных настоящим Федеральным законом, иными федеральными законами.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 12 ст. 61; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 12 ст. 61
