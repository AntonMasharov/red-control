      label: Оригинал документа
      locator: п. 3 ст. 67
fz67:article-30:clause-12:
  id: fz67:article-30:clause-12
  title: "67-ФЗ: п. 12 ст. 30"
  status: source-excerpt
  text: '12. Заверение копий протоколов и иных документов комиссий производится председателем, или заместителем председателя, или секретарем соответствующей комиссии. При этом лицо, заверяющее копию документа, на указанной копии делает запись: "Верно" или "Копия верна", расписывается, указывает свои фамилию и инициалы, дату и время заверения копии и проставляет печать соответствующей комиссии.'
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 12 ст. 30; КонсультантПлюс, получено 02.10.2026
  sourceIds:
