      locator: п. 12 ст. 30
fz67:article-68:clause-30:
  id: fz67:article-68:clause-30
  title: "67-ФЗ: п. 30 ст. 68"
  status: source-excerpt
  text: 30. Первый экземпляр протокола участковой комиссии об итогах голосования после подписания его всеми присутствующими членами участковой комиссии с правом решающего голоса и выдачи его заверенных копий лицам, имеющим право на получение этих копий, незамедлительно направляется в вышестоящую комиссию и возврату в участковую комиссию не подлежит. К первому экземпляру протокола об итогах голосования приобщаются особые мнения членов участковой комиссии с правом решающего голоса, а также поступившие в указанную комиссию в день голосования и до окончания подсчета голосов избирателей, участников референдума жалобы (заявления) на нарушения закона, на основании которого проводятся выборы, референдум, принятые по указанным жалобам (заявлениям) решения участковой комиссии и составленные участковой комиссией акты и реестры. Заверенные копии указанных документов и решений участковой комиссии прилагаются ко второму экземпляру протокола об итогах голосования. Первый экземпляр протокола об итогах голосования с приложенными к нему документами доставляется в вышестоящую комиссию председателем или секретарем участковой комиссии либо иным членом участковой комиссии с правом решающего голоса по поручению председателя участковой комиссии. При указанной передаче протокола участковой комиссии вправе присутствовать другие члены участковой комиссии, а также наблюдатели, направленные в данную участковую комиссию.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 30 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 30 ст. 68
