fz67:article-68:clause-31:
  id: fz67:article-68:clause-31
  title: "67-ФЗ: п. 31 ст. 68"
  status: source-excerpt
  text: 31. Второй экземпляр протокола об итогах голосования предоставляется для ознакомления наблюдателям, иным лицам, указанным в пункте 3 статьи 30 настоящего Федерального закона, а его заверенная копия вывешивается для всеобщего ознакомления в месте, установленном участковой комиссией. Если протокол составлен в электронном виде, его второй экземпляр изготавливается путем распечатки протокола на бумажном носителе и подписывается всеми членами участковой комиссии с правом решающего голоса, присутствовавшими при установлении итогов голосования и составлении протокола. Второй экземпляр протокола вместе с предусмотренной законом избирательной документацией, документацией референдума, включая бюллетени, списки лиц, указанных в пункте 3 статьи 30 настоящего Федерального закона, а также печать участковой комиссии передается в вышестоящую комиссию для хранения.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 31 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
