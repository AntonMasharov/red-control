  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 31 ст. 68
fz67:article-30:clause-1:
  id: fz67:article-30:clause-1
  title: "67-ФЗ: п. 1 ст. 30"
  status: source-excerpt
  text: 1. На всех заседаниях комиссии, а также при подсчете голосов избирателей, участников референдума и осуществлении участковой, территориальной комиссиями работы со списками избирателей, участников референдума, с бюллетенями, протоколами об итогах голосования и со сводными таблицами вправе присутствовать члены вышестоящих комиссий с правом решающего голоса и работники их аппаратов, кандидат, зарегистрированный данной либо вышестоящей комиссией, либо его уполномоченный представитель по финансовым вопросам или доверенное лицо, уполномоченный представитель или доверенное лицо избирательного объединения, список кандидатов которого зарегистрирован данной либо вышестоящей комиссией, или кандидат из указанного списка, член или уполномоченный представитель инициативной группы по проведению референдума. На заседании комиссии, на котором будет рассматриваться вопрос о регистрации кандидата, списка кандидатов, вправе присутствовать соответственно выдвинутый кандидат либо его уполномоченный представитель по финансовым вопросам, уполномоченный представитель избирательного объединения. Для присутствия на заседаниях комиссии и при осуществлении ею работы с указанными избирательными документами, документами, связанными с подготовкой и проведением референдума, указанным лицам не требуется дополнительное разрешение. Комиссия обязана обеспечить оповещение и возможность свободного доступа указанных лиц на свои заседания и в помещение, в котором проводится подсчет голосов избирателей, участников референдума, осуществляется работа с указанными избирательными документами, документами, связанными с подготовкой и проведением референдума.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 1 ст. 30; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 1 ст. 30
fz67:article-69:clause-1:
  id: fz67:article-69:clause-1
  title: "67-ФЗ: п. 1 ст. 69"
  status: source-excerpt
  text: 1. Первые экземпляры протоколов об итогах голосования участковых, территориальных комиссий, окружных избирательных комиссий, избирательных комиссий субъектов Российской Федерации немедленно после их подписания членами комиссии с правом решающего голоса и выдачи их заверенных копий и заверенных копий сводных таблиц лицам, имеющим право на получение этих копий, поступают в вышестоящую комиссию в целях суммирования данных, содержащихся в указанных протоколах, и последующей передачи этих данных в комиссию, устанавливающую итоги голосования в целом на территории, на которой проводились выборы, референдум, и определяющую результаты соответствующих выборов, референдума, в том числе в комиссию, организующую эти выборы, референдум.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 1 ст. 69; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 1 ст. 69
fz67:article-69:clause-2:
  id: fz67:article-69:clause-2
  title: "67-ФЗ: п. 2 ст. 69"
  status: source-excerpt
  text: |-
    2. На основании данных протоколов об итогах голосования после предварительной проверки правильности их составления вышестоящая комиссия путем суммирования содержащихся в них данных устанавливает итоги голосования на соответствующей территории, в округе, субъекте Российской Федерации, в Российской Федерации. Решение комиссии об итогах голосования оформляется протоколом об итогах голосования.

    Прием протоколов нижестоящих комиссий, суммирование данных этих протоколов и составление протокола об итогах голосования на соответствующей территории осуществляются в одном помещении, при этом все действия членов комиссии по приему протоколов нижестоящих комиссий, суммированию данных этих протоколов и составлению протокола об итогах голосования должны находиться в поле зрения членов комиссии и наблюдателей, иных лиц, указанных в пункте 3 статьи 30 настоящего Федерального закона. В указанном помещении должна находиться увеличенная форма сводной таблицы по соответствующей территории, в которую немедленно после прибытия председателя, секретаря или иного члена нижестоящей комиссии с правом решающего голоса с первым экземпляром протокола об итогах голосования заносятся данные этого протокола с указанием времени их внесения.

    Председатель, секретарь или иной член нижестоящей комиссии с правом решающего голоса передает первый экземпляр протокола нижестоящей комиссии с приложенными к нему документами члену вышестоящей комиссии с правом решающего голоса, который проверяет правильность заполнения протокола, полноту приложенных документов и выполнение контрольных соотношений.

    Если протокол и (или) сводная таблица нижестоящей комиссии об итогах голосования составлены с нарушением требований закона, предъявляемых к составлению протокола и сводной таблицы, указанная комиссия обязана составить повторный протокол и (или) сводную таблицу в соответствии с требованиями пункта 8 настоящей статьи, а первоначально представленные протокол и (или) сводная таблица остаются в вышестоящей комиссии.

    Если протокол и (или) сводная таблица нижестоящей комиссии об итогах голосования составлены в соответствии с требованиями закона, предъявляемыми к составлению протокола и (или) сводной таблицы, член вышестоящей комиссии вносит данные этого протокола в сводную таблицу вышестоящей комиссии. Председатель, секретарь или иной член нижестоящей комиссии с правом решающего голоса, передавший члену вышестоящей комиссии протокол об итогах голосования, расписывается в увеличенной форме сводной таблицы под данными протокола соответствующей комиссии об итогах голосования.

    Суммирование данных, содержащихся в протоколах нижестоящих комиссий об итогах голосования, осуществляют непосредственно члены вышестоящей комиссии с правом решающего голоса.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 2 ст. 69; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 2 ст. 69
fz67:article-20:clause-4:
  id: fz67:article-20:clause-4
  title: "67-ФЗ: п. 4 ст. 20"
  status: source-excerpt
  text: 4. Комиссии обязаны в пределах своей компетенции рассматривать поступившие к ним в период избирательной кампании, кампании референдума обращения о нарушении закона, проводить проверки по этим обращениям и давать лицам, направившим обращения, письменные ответы в пятидневный срок, но не позднее дня, предшествующего дню голосования, а по обращениям, поступившим в день голосования или в день, следующий за днем голосования, - немедленно. Если факты, содержащиеся в обращениях, требуют дополнительной проверки, решения по ним принимаются не позднее чем в десятидневный срок. Если обращение указывает на нарушение закона кандидатом, избирательным объединением, инициативной группой по проведению референдума, эти кандидат, избирательное объединение, инициативная группа по проведению референдума или его (ее) уполномоченные представители должны быть незамедлительно оповещены о поступившем обращении и вправе давать объяснения по существу обращения.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 4 ст. 20; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 4 ст. 20
fz67:article-30:clause-9:
  id: fz67:article-30:clause-9
  title: "67-ФЗ: п. 9 ст. 30"
  status: source-excerpt
  text: |-
    9. Наблюдатели вправе:

    а) знакомиться со списками избирателей, участников референдума, в том числе составленными в электронном виде, реестром заявлений (обращений) о голосовании вне помещения для голосования;

    б) находиться в помещении для голосования соответствующего избирательного участка, участка референдума в день голосования, а также в дни досрочного голосования в любое время в период, указанный в пункте 3 настоящей статьи;

    б.1) наблюдать за выдачей бюллетеней избирателям, участникам референдума;

    в) присутствовать при голосовании избирателей, участников референдума вне помещения для голосования;

    г) наблюдать за подсчетом числа граждан, внесенных в списки избирателей, участников референдума, бюллетеней, выданных избирателям, участникам референдума, погашенных бюллетеней; наблюдать за подсчетом голосов избирателей, участников референдума на избирательном участке, участке референдума на расстоянии и в условиях, обеспечивающих им обозримость содержащихся в бюллетенях отметок избирателей, участников референдума; знакомиться с любым заполненным или незаполненным бюллетенем при подсчете голосов избирателей, участников референдума; наблюдать за составлением комиссией протокола об итогах голосования и иных документов в период, указанный в пункте 3 настоящей статьи;

    д) обращаться к председателю участковой комиссии, а в случае его отсутствия к лицу, его замещающему, с предложениями и замечаниями по вопросам организации голосования;

    е) знакомиться с протоколами соответствующей комиссии, нижестоящих комиссий об итогах голосования, о результатах выборов, референдума и приложенными к ним документами, получать от соответствующей комиссии заверенные копии указанных протоколов;

    ж) носить нагрудный знак с обозначением своего статуса и указанием своих фамилии, имени и отчества, а также фамилии, имени и отчества зарегистрированного кандидата или наименования избирательного объединения, общественного объединения, субъекта общественного контроля, направивших наблюдателя в комиссию. Законом может быть предусмотрено, что форма нагрудного знака устанавливается комиссией, организующей выборы, референдум;

    з) обжаловать в порядке, установленном статьей 75 настоящего Федерального закона, действия (бездействие) комиссии в вышестоящую комиссию, избирательную комиссию субъекта Российской Федерации, Центральную избирательную комиссию Российской Федерации или в суд;

    и) присутствовать при повторном подсчете голосов избирателей, участников референдума в соответствующих комиссиях;

    к) производить в помещении для голосования (с того места, которое определено председателем участковой комиссии) фото- и (или) видеосъемку, предварительно уведомив об этом председателя, заместителя председателя или секретаря участковой комиссии.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 9 ст. 30; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 9 ст. 30
fz67:article-30:clause-10:
  id: fz67:article-30:clause-10
  title: "67-ФЗ: п. 10 ст. 30"
  status: source-excerpt
  text: |-
    10. Наблюдатель не вправе:

    а) выдавать избирателям, участникам референдума бюллетени;

    б) расписываться за избирателя, участника референдума, в том числе по его просьбе, в получении бюллетеней;

    в) заполнять за избирателя, участника референдума, в том числе по его просьбе, бюллетени;

    г) предпринимать действия, нарушающие тайну голосования;

    д) принимать непосредственное участие в проводимом членами комиссии с правом решающего голоса подсчете бюллетеней;

    е) совершать действия, препятствующие работе комиссии;

    ж) проводить агитацию среди избирателей, участников референдума;

    з) участвовать в принятии решений соответствующей комиссией.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 10 ст. 30; КонсультантПлюс, получено 02.10.2026
