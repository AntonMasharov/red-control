fz67:article-66:clause-17:
  id: fz67:article-66:clause-17
  title: "67-ФЗ: п. 17 ст. 66"
  status: source-excerpt
  text: 17. По окончании голосования с использованием каждого переносного ящика для голосования участковая комиссия составляет акт, в котором указываются количество бюллетеней, выданных членам участковой комиссии с правом решающего голоса, проводившим голосование вне помещения для голосования, количество письменных заявлений избирателей, участников референдума о предоставлении им возможности проголосовать вне помещения для голосования, количество выданных избирателям, участникам референдума и возвращенных (неиспользованных, испорченных избирателями, участниками референдума) бюллетеней, а также сведения о членах участковой комиссии с правом решающего голоса, проводивших голосование вне помещения для голосования, и наблюдателях, присутствовавших при проведении голосования вне помещения для голосования.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 17 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
