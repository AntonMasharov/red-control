  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 14 ст. 68
fz67:article-68:clause-17:
  id: fz67:article-68:clause-17
  title: "67-ФЗ: п. 17 ст. 68"
  status: source-excerpt
  text: 17. Недействительные бюллетени подсчитываются и суммируются отдельно. Недействительными считаются бюллетени, которые не содержат отметок в квадратах, расположенных напротив фамилий кандидатов, наименований избирательных объединений, в квадратах, относящихся к позициям "Да" и "Нет" ("За" и "Против"), или в которых число отметок в указанных квадратах превышает число отметок, установленное законом. Если на выборах в органы местного самоуправления в избирательном бюллетене помещается строка "Против всех кандидатов" ("Против всех списков кандидатов"), недействительными считаются бюллетени, которые не содержат отметок в квадратах, расположенных напротив фамилий кандидатов, наименований избирательных объединений, позиции "Против всех кандидатов" ("Против всех списков кандидатов"), или в которых отметки проставлены в квадрате, расположенном напротив позиции "Против всех кандидатов" ("Против всех списков кандидатов"), и хотя бы в одном из квадратов, расположенных напротив фамилий кандидатов, наименований избирательных объединений, или в которых число отметок в указанных квадратах превышает число отметок, установленное законом. В случае возникновения сомнений в определении волеизъявления избирателя, участника референдума этот бюллетень откладывается в отдельную пачку. По окончании сортировки участковая комиссия решает вопрос о действительности всех сомнительных бюллетеней путем голосования, при этом на оборотной стороне бюллетеня указываются причины признания его действительным или недействительным. Эта запись подтверждается подписями двух или более членов участковой комиссии с правом решающего голоса и заверяется печатью участковой комиссии. Бюллетень, признанный действительным или недействительным, присоединяется к соответствующей пачке бюллетеней. Общее число недействительных бюллетеней (с учетом числа бюллетеней, признанных недействительными в соответствии с пунктом 12 настоящей статьи и пунктом 15 статьи 65 настоящего Федерального закона) заносится в строку 10 протокола об итогах голосования и его увеличенной формы.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 17 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 17 ст. 68
fz67:article-68:clause-18:
  id: fz67:article-68:clause-18
  title: "67-ФЗ: п. 18 ст. 68"
  status: source-excerpt
  text: 18. После этого производится подсчет рассортированных бюллетеней установленной формы в каждой пачке отдельно по каждому кандидату (списку кандидатов), а на выборах в органы местного самоуправления также по позиции "Против всех кандидатов" ("Против всех списков кандидатов"), по позициям "Да" и "Нет" ("За" и "Против"). При этом бюллетени подсчитываются путем перекладывания их по одному из одной части пачки в другую таким образом, чтобы лица, присутствующие при подсчете, могли увидеть отметку избирателя, участника референдума в каждом бюллетене. Одновременный подсчет бюллетеней из разных пачек не допускается. Полученные данные заносятся в строку 12 и последующие строки протокола об итогах голосования, а также его увеличенной формы.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 18 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 18 ст. 68
fz67:article-68:clause-19:
  id: fz67:article-68:clause-19
  title: "67-ФЗ: п. 19 ст. 68"
  status: source-excerpt
  text: 19. Члены участковой комиссии с правом решающего голоса подсчитывают и вносят в строку 11 протокола об итогах голосования и его увеличенной формы число действительных бюллетеней.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 19 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 19 ст. 68
fz67:article-68:clause-20:
  id: fz67:article-68:clause-20
  title: "67-ФЗ: п. 20 ст. 68"
  status: source-excerpt
  text: 20. Члены участковой комиссии с правом решающего голоса подсчитывают, оглашают и вносят в строку 9 протокола об итогах голосования и его увеличенной формы число бюллетеней установленной формы, находящихся в стационарных ящиках для голосования.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 20 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 20 ст. 68
fz67:article-68:clause-21:
  id: fz67:article-68:clause-21
  title: "67-ФЗ: п. 21 ст. 68"
  status: source-excerpt
  text: 21. После этого с рассортированными бюллетенями под контролем членов участковой комиссии с правом решающего голоса вправе визуально ознакомиться наблюдатели.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 21 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 21 ст. 68
fz67:article-68:clause-22:
  id: fz67:article-68:clause-22
  title: "67-ФЗ: п. 22 ст. 68"
  status: source-excerpt
  text: 22. После ознакомления наблюдателей с рассортированными бюллетенями проводится проверка контрольных соотношений данных, внесенных в протокол об итогах голосования, в соответствии с приложением 11 к настоящему Федеральному закону (за исключением контрольного соотношения, проверка которого проводится в соответствии с пунктом 6 настоящей статьи) с учетом нумерации строк протокола об итогах голосования, предусмотренной законом. Если указанные контрольные соотношения не выполняются, участковая комиссия принимает решение о дополнительном подсчете по всем или отдельным строкам протокола об итогах голосования, в том числе о дополнительном подсчете бюллетеней. Если в результате дополнительного подсчета контрольные соотношения не выполняются вновь, участковая комиссия составляет соответствующий акт, который прилагается к протоколу об итогах голосования, и вносит данные о расхождении в строки 11ж и 11з протокола. Если в результате дополнительного подсчета необходимо внести изменения в протокол об итогах голосования, заполняется новый бланк протокола, а в его увеличенную форму вносятся соответствующие исправления. Если контрольные соотношения выполняются, в строках 11ж и 11з протокола проставляется цифра "0".
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 22 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 22 ст. 68
fz67:article-68:clause-23:
  id: fz67:article-68:clause-23
  title: "67-ФЗ: п. 23 ст. 68"
  status: source-excerpt
  text: 23. После завершения подсчета рассортированные бюллетени упаковываются в отдельные пачки. Сложенные таким образом бюллетени, а также список избирателей, список участников референдума помещаются в мешки или коробки, на которых указываются номер избирательного участка, участка референдума, общее число всех упакованных бюллетеней. Мешки или коробки опечатываются и могут быть вскрыты только по решению вышестоящей комиссии или суда. На указанных мешках или коробках вправе поставить свои подписи члены участковой комиссии с правом решающего голоса, наблюдатели. Упаковка осуществляется в присутствии лиц, которые указаны в пункте 3 статьи 30 настоящего Федерального закона и которым предоставляется возможность поставить на мешках или коробках свои подписи.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 23 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 23 ст. 68
fz67:article-68:clause-26:
  id: fz67:article-68:clause-26
  title: "67-ФЗ: п. 26 ст. 68"
  status: source-excerpt
  text: 26. После проведения всех необходимых действий и подсчетов участковая комиссия в обязательном порядке проводит итоговое заседание, на котором рассматриваются жалобы (заявления) о нарушениях при голосовании и подсчете голосов избирателей, участников референдума, после чего подписывается протокол участковой комиссии об итогах голосования и выдаются копии протокола лицам, указанным в пункте 3 статьи 30 настоящего Федерального закона. Протокол об итогах голосования заполняется в двух экземплярах и подписывается всеми присутствующими членами участковой комиссии с правом решающего голоса, в нем проставляются дата и время (час с минутами) его подписания. Протокол об итогах голосования, полученный с применением технического средства подсчета голосов либо с использованием комплекса для электронного голосования, приобретает юридическую силу после указанного подписания. Не допускаются заполнение протокола об итогах голосования карандашом и внесение в него каких-либо изменений. Подписание протокола с нарушением этого порядка является основанием для признания этого протокола недействительным и проведения повторного подсчета голосов.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 26 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 26 ст. 68
fz67:article-28:clause-13:
  id: fz67:article-28:clause-13
  title: "67-ФЗ: п. 13 ст. 28"
  status: source-excerpt
  text: 13. Решения комиссии об избрании, о назначении на должность либо об освобождении от должности председателя, заместителя председателя, секретаря комиссии, а также о внесении предложений по кандидатурам на указанные должности, о финансовом обеспечении подготовки и проведения выборов, референдума, о регистрации кандидатов, списков кандидатов и об обращении в суд с заявлением об отмене их регистрации, об итогах голосования или о результатах выборов, референдума, о признании выборов, референдума несостоявшимися или недействительными, о проведении повторного голосования или повторных выборов, об отмене решения комиссии в порядке, предусмотренном пунктом 11 статьи 20 и пунктами 6 и 7 статьи 75 настоящего Федерального закона, принимаются на заседании комиссии большинством голосов от установленного числа членов комиссии с правом решающего голоса. Решения об освобождении от должности председателя, заместителя председателя, секретаря комиссии, замещающих указанные должности в результате избрания, принимаются тайным голосованием (за исключением случая освобождения от должности по личному заявлению), при этом избрание новых председателя, заместителя председателя, секретаря комиссии осуществляется в порядке, предусмотренном пунктами 4 и 8 настоящей статьи.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 13 ст. 28; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 13 ст. 28
fz67:article-68:clause-27:
  id: fz67:article-68:clause-27
  title: "67-ФЗ: п. 27 ст. 68"
  status: source-excerpt
  text: 27. Если во время заполнения протокола об итогах голосования некоторые члены участковой комиссии с правом решающего голоса отсутствуют, в протоколе делается об этом запись с указанием причины их отсутствия. Протокол является действительным, если он подписан большинством от установленного числа членов участковой комиссии с правом решающего голоса. Если при подписании протокола об итогах голосования имеет место проставление подписи хотя бы за одного члена участковой комиссии с правом решающего голоса другим членом участковой комиссии или посторонним лицом, это является основанием для признания данного протокола недействительным и проведения повторного подсчета голосов.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 27 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 27 ст. 68
fz67:article-68:clause-28:
  id: fz67:article-68:clause-28
  title: "67-ФЗ: п. 28 ст. 68"
  status: source-excerpt
  text: 28. При подписании протокола об итогах голосования члены участковой комиссии с правом решающего голоса, несогласные с содержанием протокола, вправе приложить к протоколу особое мнение, о чем в протоколе делается соответствующая запись.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 28 ст. 68; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 28 ст. 68
fz67:article-67:clause-2:
  id: fz67:article-67:clause-2
  title: "67-ФЗ: п. 2 ст. 67"
  status: source-excerpt
  text: |-
    2. В случае, если протокол об итогах голосования оформляется на бумажном носителе, он должен быть составлен на одном листе. В исключительных случаях он может быть составлен более чем на одном листе, при этом каждый лист должен быть пронумерован, подписан всеми присутствующими членами участковой комиссии с правом решающего голоса и заверен печатью участковой комиссии. Протокол об итогах голосования должен содержать:

    а) номер экземпляра;

    б) название выборов, референдума, дату голосования;

    в) слово "Протокол";

    г) адрес помещения для голосования с указанием номера избирательного участка, участка референдума;

    д) строки протокола в следующей последовательности:

    строка 1: число избирателей, участников референдума, внесенных в список на момент окончания голосования;

    строка 2: число бюллетеней, полученных участковой комиссией;

    строка 3: число бюллетеней, выданных избирателям, участникам референдума, проголосовавшим досрочно, в том числе отдельной строкой 4 - в помещении территориальной комиссии (избирательной комиссии, организующей подготовку и проведение выборов в органы местного самоуправления, местного референдума, окружной избирательной комиссии);

    строка 5: число бюллетеней, выданных избирателям, участникам референдума в помещении для голосования в день голосования;

    строка 6: число бюллетеней, выданных избирателям, участникам референдума, проголосовавшим вне помещения для голосования в день голосования;

    строка 7: число погашенных бюллетеней;

    строка 8: число бюллетеней, содержащихся в переносных ящиках для голосования;

    строка 9: число бюллетеней, содержащихся в стационарных ящиках для голосования;

    строка 10: число недействительных бюллетеней;

    строка 11: число действительных бюллетеней;

    строка 12 и последующие строки: число голосов избирателей по каждой из позиций, содержащихся во всех избирательных бюллетенях, а на выборах в органы местного самоуправления по каждой из позиций, включая позицию "Против всех кандидатов" ("Против всех списков кандидатов"), число голосов участников референдума по позициям "Да" и "Нет" ("За" и "Против"), содержащимся в бюллетенях для голосования на референдуме.

    Абзацы тринадцатый - девятнадцатый утратили силу. - Федеральный закон от 29.05.2023 N 184-ФЗ.

    Для внесения сведений, получаемых в случае, предусмотренном пунктом 22 статьи 68 настоящего Федерального закона, протокол об итогах голосования должен также содержать следующие строки:

    строка 11ж: число утраченных бюллетеней;

    строка 11з: число бюллетеней, не учтенных при получении;

    е) сведения о количестве поступивших в участковую комиссию в день голосования и до окончания подсчета голосов избирателей, участников референдума жалоб (заявлений), прилагаемых к протоколу;

    ж) фамилии и инициалы председателя, заместителя председателя, секретаря и других членов участковой комиссии с правом решающего голоса и их подписи;

    з) дату и время подписания протокола;

    и) печать участковой комиссии (для протокола, составленного на бумажном носителе).
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 2 ст. 67; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 2 ст. 67
fz67:article-67:clause-3:
  id: fz67:article-67:clause-3
  title: "67-ФЗ: п. 3 ст. 67"
  status: source-excerpt
  text: 3. Числа, указанные в пункте 2 настоящей статьи, вносятся в протокол об итогах голосования цифрами и прописью. Нумерация строк протокола устанавливается законом.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 3 ст. 67; КонсультантПлюс, получено 02.10.2026
  sourceIds:
