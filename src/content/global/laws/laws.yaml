fz67:article-17:clause-13:
  id: fz67:article-17:clause-13
  title: "67-ФЗ: п. 13 ст. 17"
  status: source-excerpt
  text: 13. Соответствующая территориальная комиссия (окружная избирательная комиссия) передает по акту участковым комиссиям первый экземпляр списка избирателей, участников референдума конкретного избирательного участка, участка референдума не позднее чем за 10 дней до дня голосования. Участковая комиссия вправе разделить первый экземпляр списка избирателей, участников референдума на отдельные книги. Каждая такая книга не позднее дня, предшествующего дню голосования, должна быть сброшюрована (прошита), что подтверждается печатью соответствующей участковой комиссии и подписью ее председателя.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 13 ст. 17; КонсультантПлюс, получено 02.10.2026
  sourceIds:
