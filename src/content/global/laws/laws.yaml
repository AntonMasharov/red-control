  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 13 ст. 17
fz67:article-17:clause-17:
  id: fz67:article-17:clause-17
  title: "67-ФЗ: п. 17 ст. 17"
  status: source-excerpt
  text: '17. Если в соответствии с пунктом 16 статьи 64 настоящего Федерального закона не предусмотрено включение гражданина Российской Федерации в список избирателей, участников референдума по месту его нахождения, избиратели, участники референдума, находящиеся в местах временного пребывания, работающие на предприятиях с непрерывным циклом работы и занятые на отдельных видах работ, где невозможно уменьшение продолжительности работы (смены), а также избиратели, участники референдума из числа военнослужащих, находящихся вне места расположения воинской части, и избиратели, участники референдума, работающие вахтовым методом, решением участковой комиссии могут быть включены в список избирателей, участников референдума на избирательном участке, участке референдума по месту их временного пребывания по личному письменному заявлению, поданному в участковую комиссию не позднее чем за три дня до дня (первого дня) голосования. Если в соответствии с пунктом 16 статьи 64 настоящего Федерального закона предусмотрено включение гражданина Российской Федерации в список избирателей, участников референдума по месту его нахождения, избиратели, участники референдума, которые будут находиться в день голосования в больницах или местах содержания под стражей подозреваемых и обвиняемых, а также избиратели, участники референдума из числа военнослужащих, находящихся вне места расположения воинской части, и избиратели, участники референдума, работающие вахтовым методом, не имевшие возможности подать заявление о включении в список избирателей, участников референдума по месту нахождения, решением участковой комиссии могут быть включены в список избирателей, участников референдума на избирательном участке, участке референдума по месту их временного пребывания по личному письменному заявлению, поданному в участковую комиссию не позднее 14 часов по местному времени дня, предшествующего дню голосования (такие избиратели, участники референдума включаются в список избирателей, участников референдума в указанном порядке также в случае совмещения дня голосования на соответствующих выборах, референдуме с днем голосования на выборах в органы местного самоуправления, местном референдуме). Информация о включении избирателя, участника референдума в список избирателей, участников референдума на избирательном участке, участке референдума по месту их временного пребывания передается, в том числе с использованием ГАС "Выборы", в участковую комиссию избирательного участка, участка референдума, где данный избиратель, участник референдума включен в список избирателей, участников референдума по месту его жительства. Участковая комиссия в соответствующей строке списка избирателей, участников референдума делает отметку: "Включен в список избирателей (участников референдума) на избирательном участке (участке референдума) N" с указанием номера избирательного участка, участка референдума и при необходимости наименования субъекта Российской Федерации. Законом может быть предусмотрено, что избиратели, участники референдума, не имеющие регистрации по месту своего жительства в пределах Российской Федерации, решением участковой комиссии могут быть включены в список избирателей, участников референдума на избирательном участке, участке референдума, образованных или определенных решением вышестоящей комиссии для проведения голосования этих избирателей, участников референдума, по личному письменному заявлению, поданному в участковую комиссию не позднее чем в день голосования.'
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 17 ст. 17; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 17 ст. 17
cik86:clause-1.10:
  id: cik86:clause-1.10
  title: "ЦИК № 86/718-8: п. 1.10 к Положению"
  status: source-excerpt
  text: 1.10. При выдаче избирательного бюллетеня в помещении для голосования член участковой избирательной комиссии с правом решающего голоса, проставляя в соответствующей графе списка избирателей свою подпись, дополнительно в графе "Особые отметки" указывает дату получения избирателем избирательного бюллетеня.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 1.10 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 1.10 к Положению
cik86:clause-2.7:
  id: cik86:clause-2.7
  title: "ЦИК № 86/718-8: п. 2.7 к Положению"
  status: source-excerpt
  text: |-
    2.7. При получении избирательного бюллетеня избиратель проставляет в книге списка избирателей серию и номер своего паспорта или документа, заменяющего паспорт гражданина, и расписывается за каждый полученный избирательный бюллетень.

    С согласия избирателя либо по его просьбе серия и номер предъявляемого им паспорта или документа, заменяющего паспорт гражданина, могут быть внесены членом участковой избирательной комиссии с правом решающего голоса.

    Если серия и номер паспорта или документа, заменяющего паспорт гражданина, внесены в список избирателей с использованием ГАС "Выборы", перед выдачей избирательного бюллетеня член участковой избирательной комиссии с правом решающего голоса сверяет указанные в списке избирателей сведения с предъявляемым избирателем документом.

    Избиратель проверяет правильность произведенной записи и расписывается в соответствующей графе (графах) книги списка избирателей.

    Член участковой избирательной комиссии с правом решающего голоса ставит в соответствующей графе (графах) книги списка избирателей свою подпись, делает отметку о том, что избиратель проголосовал вне помещения для голосования, указывает номер переносного ящика для голосования, дату получения избирателем избирательного бюллетеня.
  source: Постановление ЦИК России от 08.06.2022 № 86/718-8 (ред. от 24.06.2026); п. 2.7 к Положению
  sourceIds:
    - cik-multiday-voting
  references:
    - sourceId: cik-multiday-voting
      label: Оригинал документа
      locator: п. 2.7 к Положению
fz67:article-64:clause-16:
  id: fz67:article-64:clause-16
  title: "67-ФЗ: п. 16 ст. 64"
  status: source-excerpt
  text: 16. При проведении выборов в органы государственной власти, референдума субъекта Российской Федерации избиратель, участник референдума, который будет находиться в день голосования вне места своего жительства, вправе подать в избирательную комиссию, комиссию референдума заявление о включении в список избирателей, участников референдума по месту своего нахождения (далее в настоящем пункте - заявление) в порядке, установленном Центральной избирательной комиссией Российской Федерации (далее в настоящем пункте - порядок). Срок подачи заявления устанавливается Центральной избирательной комиссией Российской Федерации в пределах срока, который начинается не ранее чем за 45 дней до дня (первого дня) голосования и заканчивается в 14 часов по местному времени дня, предшествующего дню голосования. Заявление может быть подано избирателем, участником референдума только лично по предъявлении паспорта (в период замены паспорта - временного удостоверения личности). Заявление может быть подано с использованием федеральной государственной информационной системы "Единый портал государственных и муниципальных услуг (функций)", через многофункциональный центр предоставления государственных и муниципальных услуг, если это предусмотрено порядком. Порядком предусматриваются способы защиты заявления от подделок. Порядком может быть предусмотрено использование в целях указанной защиты специального знака (марки), при этом порядок должен содержать требование об учете специальных знаков (марок), в том числе при их передаче комиссиями. Избиратель, участник референдума, подавший заявление, исключается из списка избирателей, участников референдума по месту своего жительства. Избиратель, участник референдума, подавший заявление, может быть включен в список избирателей, участников референдума по месту своего нахождения только на одном избирательном участке, участке референдума. Избиратель, участник референдума, подавший заявление и явившийся в день голосования на избирательный участок, участок референдума по месту своего жительства, может быть включен в список избирателей, участников референдума только по решению участковой комиссии и только после установления факта, свидетельствующего о том, что он не проголосовал на избирательном участке, участке референдума по месту своего нахождения. В случае включения избирателя, участника референдума в список избирателей, участников референдума по месту своего жительства он утрачивает право быть включенным в список избирателей, участников референдума по месту своего нахождения. Информация о подаче заявления избирателем, участником референдума, в том числе об избирательном участке, участке референдума, на котором избиратель, участник референдума, подавший заявление, должен быть в соответствии с порядком включен в список избирателей, участников референдума, обрабатывается и доводится до сведения соответствующих территориальных и участковых комиссий, в том числе с использованием ГАС "Выборы". Информация о числе избирателей, участников референдума, подавших заявления, отдельно по каждому избирательному участку, участку референдума размещается в информационно-телекоммуникационной сети "Интернет" в соответствии с порядком. В этом случае предусмотренное пунктом 2 статьи 65 настоящего Федерального закона досрочное голосование не проводится. Законом субъекта Российской Федерации может быть предусмотрено, что при проведении выборов в органы государственной власти субъекта Российской Федерации, референдума субъекта Российской Федерации порядок включения избирателя, участника референдума в список избирателей, участников референдума, установленный настоящим пунктом, не применяется. В этом случае закон субъекта Российской Федерации должен предусматривать досрочное голосование, предусмотренное пунктом 2 статьи 65 настоящего Федерального закона.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 16 ст. 64; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 16 ст. 64
fz67:article-66:clause-2:
  id: fz67:article-66:clause-2
  title: "67-ФЗ: п. 2 ст. 66"
  status: source-excerpt
  text: 2. Голосование вне помещения для голосования проводится, за исключением случаев, предусмотренных подпунктом "а" пункта 4 статьи 63.1, пунктом 1 статьи 65 настоящего Федерального закона и пунктом 18 настоящей статьи, только в день голосования и только на основании письменного заявления или устного обращения (в том числе переданного при содействии других лиц) избирателя, участника референдума о предоставлении ему возможности проголосовать вне помещения для голосования. Участковая комиссия регистрирует все поданные заявления (устные обращения) непосредственно в день подачи заявления (устного обращения) в специальном реестре, который по окончании голосования хранится вместе со списком избирателей, участников референдума. Указанный реестр может быть составлен в электронном виде в порядке, установленном Центральной избирательной комиссией Российской Федерации.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 2 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 2 ст. 66
fz67:article-66:clause-3:
  id: fz67:article-66:clause-3
  title: "67-ФЗ: п. 3 ст. 66"
  status: source-excerpt
  text: 3. При регистрации устного обращения в реестре, предусмотренном в пункте 2 настоящей статьи, указываются время поступления данного обращения, фамилия, имя, отчество избирателя, участника референдума, заявившего о своем желании проголосовать вне помещения для голосования, адрес его места жительства, а также подпись члена комиссии, принявшего обращение. Если обращение передано при содействии другого лица, в реестре также указываются фамилия, имя, отчество и адрес места жительства этого лица. По прибытии членов комиссии к избирателю, участнику референдума данное обращение подтверждается письменным заявлением.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 3 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 3 ст. 66
fz67:article-66:clause-4:
  id: fz67:article-66:clause-4
  title: "67-ФЗ: п. 4 ст. 66"
  status: source-excerpt
  text: 4. В заявлении (устном обращении) о предоставлении возможности проголосовать вне помещения для голосования должна быть указана причина, по которой избиратель, участник референдума не может прибыть в помещение для голосования. В заявлении должны содержаться фамилия, имя и отчество избирателя, участника референдума, адрес его места жительства.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 4 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 4 ст. 66
fz67:article-66:clause-5:
  id: fz67:article-66:clause-5
  title: "67-ФЗ: п. 5 ст. 66"
  status: source-excerpt
  text: 5. Заявления (устные обращения), указанные в пункте 4 настоящей статьи, могут быть поданы в любое время в течение 10 дней до дня голосования, но не позднее чем за шесть часов до окончания времени голосования. Заявление (устное обращение), поступившее позднее указанного срока, не подлежит удовлетворению, о чем избиратель, участник референдума либо лицо, оказавшее содействие в передаче обращения, уведомляется устно непосредственно в момент принятия заявления (устного обращения).
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 5 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 5 ст. 66
fz67:article-61:clause-11:
  id: fz67:article-61:clause-11
  title: "67-ФЗ: п. 11 ст. 61"
  status: source-excerpt
  text: 11. Помещение для голосования должно быть оборудовано таким образом, чтобы места выдачи бюллетеней, места для тайного голосования и ящики для голосования, технические средства подсчета голосов при их использовании одновременно находились в поле зрения членов участковой комиссии, наблюдателей.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 11 ст. 61; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 11 ст. 61
fz67:article-61:clause-3:
  id: fz67:article-61:clause-3
  title: "67-ФЗ: п. 3 ст. 61"
  status: source-excerpt
  text: |-
    3. В помещении для голосования либо непосредственно перед указанным помещением участковая комиссия оборудует информационный стенд, на котором размещает следующую информацию обо всех кандидатах, списках кандидатов, избирательных объединениях, внесенных в бюллетень, если иное не установлено федеральным законом:

    а) биографические данные кандидатов в объеме, установленном комиссией, организующей выборы, но не меньшем, чем объем биографических данных, внесенных в бюллетень;

    б) если кандидат, список кандидатов выдвинуты избирательным объединением, - слова "выдвинут избирательным объединением" с указанием наименования этого избирательного объединения;

    в) если кандидат сам выдвинул свою кандидатуру, - слово "самовыдвижение";

    г) утратил силу. - Федеральный закон от 09.02.2009 N 3-ФЗ;

    д) сведения о доходах и об имуществе кандидатов в объеме, установленном организующей выборы избирательной комиссией;

    е) информацию о фактах представления кандидатами недостоверных сведений, предусмотренных пунктами 2 и 3 статьи 33 настоящего Федерального закона (если такая информация имеется).
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 3 ст. 61; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 3 ст. 61
fz67:article-61:clause-3.1:
  id: fz67:article-61:clause-3.1
  title: "67-ФЗ: п. 3.1 ст. 61"
  status: source-excerpt
  text: 3.1. При проведении выборов высшего должностного лица субъекта Российской Федерации участковая комиссия размещает на информационном стенде сведения о кандидатурах для наделения полномочиями сенатора Российской Федерации, представленных кандидатами на должность высшего должностного лица субъекта Российской Федерации, предусмотренные подпунктами "а" - "г" пункта 1.2 статьи 38 настоящего Федерального закона. Информационные материалы, содержащие указанные сведения, также могут предоставляться участковой комиссией каждому избирателю непосредственно.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 3.1 ст. 61; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 3.1 ст. 61
fz67:article-61:clause-4:
  id: fz67:article-61:clause-4
  title: "67-ФЗ: п. 4 ст. 61"
  status: source-excerpt
  text: 4. Если у зарегистрированного кандидата, в том числе из списка кандидатов, имелась или имеется судимость, на информационном стенде размещаются сведения о судимости кандидата, а если судимость снята или погашена, - также сведения о дате снятия или погашения судимости. Если зарегистрированный кандидат, в том числе в составе списка кандидатов, является кандидатом, аффилированным с иностранным агентом, на информационном стенде размещается информация об этом.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 4 ст. 61; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 4 ст. 61
fz67:article-61:clause-5:
  id: fz67:article-61:clause-5
  title: "67-ФЗ: п. 5 ст. 61"
  status: repealed-in-source
  text: 5. Утратил силу. - Федеральный закон от 25.07.2006 N 128-ФЗ.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 5 ст. 61; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 5 ст. 61
fz67:article-61:clause-6:
  id: fz67:article-61:clause-6
  title: "67-ФЗ: п. 6 ст. 61"
  status: source-excerpt
  text: 6. При проведении референдума на информационном стенде размещаются информационные материалы о вопросах референдума, включая текст нормативного акта, вынесенного на референдум.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 6 ст. 61; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 6 ст. 61
fz67:article-61:clause-7:
  id: fz67:article-61:clause-7
  title: "67-ФЗ: п. 7 ст. 61"
  status: source-excerpt
  text: 7. Размещаемые на информационном стенде материалы не должны содержать признаки предвыборной агитации, агитации по вопросам референдума.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 7 ст. 61; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 7 ст. 61
fz67:article-61:clause-7.1:
  id: fz67:article-61:clause-7.1
  title: "67-ФЗ: п. 7.1 ст. 61"
  status: source-excerpt
  text: 7.1. Для информирования избирателей, участников референдума, являющихся инвалидами по зрению, на информационном стенде размещаются материалы, указанные в пунктах 3, 4 и 6 настоящей статьи, выполненные крупным шрифтом и (или) с применением рельефно-точечного шрифта Брайля. Избирательные участки, участки референдума, на информационных стендах которых размещаются такие материалы, определяются решением организующей выборы, референдум комиссии, а на выборах в федеральные органы государственной власти - решением избирательной комиссии субъекта Российской Федерации.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 7.1 ст. 61; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 7.1 ст. 61
fz67:article-61:clause-8:
  id: fz67:article-61:clause-8
  title: "67-ФЗ: п. 8 ст. 61"
  status: source-excerpt
  text: 8. На информационном стенде размещаются образцы заполненных избирательных бюллетеней, которые не должны содержать фамилии кандидатов, зарегистрированных в данном избирательном округе, наименования избирательных объединений, участвующих в данных выборах, образцы бюллетеней для голосования на референдуме, в которых должны быть приведены варианты заполнения бюллетеня (бюллетеней).
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 8 ст. 61; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 8 ст. 61
fz67:article-61:clause-9:
  id: fz67:article-61:clause-9
  title: "67-ФЗ: п. 9 ст. 61"
  status: source-excerpt
  text: 9. В помещении для голосования должна находиться увеличенная форма протокола об итогах голосования, предназначенная для занесения в нее данных об итогах голосования по мере их установления. Увеличенная форма протокола об итогах голосования вывешивается до начала голосования и должна находиться в поле зрения членов участковой комиссии, наблюдателей и на расстоянии, необходимом для восприятия содержащейся в ней информации.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 9 ст. 61; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 9 ст. 61
fz67:article-64:clause-4:
  id: fz67:article-64:clause-4
  title: "67-ФЗ: п. 4 ст. 64"
  status: source-excerpt
  text: 4. Каждый избиратель, участник референдума голосует лично, голосование за других избирателей, участников референдума не допускается.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 4 ст. 64; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 4 ст. 64
fz67:article-64:clause-5:
  id: fz67:article-64:clause-5
  title: "67-ФЗ: п. 5 ст. 64"
  status: source-excerpt
  text: 5. Бюллетени выдаются избирателям, участникам референдума, включенным в список избирателей, участников референдума, по предъявлении паспорта или документа, заменяющего паспорт гражданина.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 5 ст. 64; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 5 ст. 64
fz67:article-17:clause-16:
  id: fz67:article-17:clause-16
  title: "67-ФЗ: п. 16 ст. 17"
  status: source-excerpt
  text: 16. Гражданин Российской Федерации, обладающий активным избирательным правом, правом на участие в референдуме, вправе обратиться в участковую комиссию с заявлением о включении его в список избирателей, участников референдума, о любой ошибке или неточности в сведениях о нем, внесенных в список избирателей, участников референдума. В течение 24 часов, а в день голосования в течение двух часов с момента обращения, но не позднее момента окончания голосования участковая комиссия обязана проверить сообщенные заявителем сведения и представленные документы и либо устранить ошибку или неточность, либо принять решение об отклонении заявления с указанием причин такого отклонения, вручив заверенную копию этого решения заявителю. Решение участковой комиссии об отклонении заявления о включении гражданина Российской Федерации в список избирателей, участников референдума может быть обжаловано в вышестоящую комиссию или в суд (по месту нахождения участковой комиссии), которые обязаны рассмотреть жалобу (заявление) в трехдневный срок, а за три и менее дня до дня голосования и в день голосования - немедленно. В случае, если принято решение об удовлетворении жалобы (заявления), исправление в списке избирателей, участников референдума производится участковой комиссией немедленно. Исключение гражданина Российской Федерации из списка избирателей, участников референдума после его подписания председателями и секретарями соответствующих комиссий и заверения его печатями этих комиссий в порядке, предусмотренном пунктом 12 настоящей статьи, производится только на основании официальных документов, в том числе сообщения вышестоящей комиссии о включении избирателя, участника референдума в список избирателей, участников референдума на другом избирательном участке, участке референдума. При этом в списке избирателей, участников референдума, а также в базе данных ГАС "Выборы" указывается дата исключения гражданина Российской Федерации из списка, а также причина такого исключения. Запись в списке избирателей, участников референдума заверяется подписью председателя участковой комиссии с указанием даты внесения этой подписи. Каждый гражданин Российской Федерации вправе сообщить в участковую комиссию об изменении указанных в пункте 5 статьи 16 настоящего Федерального закона сведений об избирателях, участниках референдума, включенных в список избирателей, участников референдума на соответствующем участке.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 16 ст. 17; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 16 ст. 17
fz67:article-66:clause-16:
  id: fz67:article-66:clause-16
  title: "67-ФЗ: п. 16 ст. 66"
  status: source-excerpt
  text: 16. Если избиратель, участник референдума, от которого поступило заявление (устное обращение) о предоставлении ему возможности проголосовать вне помещения для голосования, прибыл в помещение для голосования после направления к нему членов участковой комиссии для проведения голосования вне помещения для голосования, соответствующий член участковой комиссии не вправе выдать данному избирателю, участнику референдума в помещении для голосования бюллетень до возвращения членов комиссии, выезжавших по заявлению (устному обращению) данного избирателя, участника референдума, и установления факта, что указанный избиратель, участник референдума не проголосовал вне помещения для голосования.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 16 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 16 ст. 66
fz67:article-64:clause-6:
  id: fz67:article-64:clause-6
  title: "67-ФЗ: п. 6 ст. 64"
  status: source-excerpt
  text: 6. При получении бюллетеня избиратель, участник референдума проставляет в списке избирателей, участников референдума серию и номер своего паспорта или документа, заменяющего паспорт гражданина. С согласия избирателя, участника референдума либо по его просьбе серия и номер предъявляемого им паспорта или документа, заменяющего паспорт гражданина, могут быть внесены в список избирателей, участников референдума членом участковой комиссии с правом решающего голоса. На основании соответствующего решения комиссии, организующей выборы, референдум, серия и номер паспорта или документа, заменяющего паспорт гражданина, могут быть внесены в список избирателей, участников референдума с использованием ГАС "Выборы" при составлении указанного списка. Избиратель, участник референдума проверяет правильность произведенной записи и расписывается в соответствующей графе списка избирателей, участников референдума в получении бюллетеня. В случае проведения голосования одновременно по нескольким бюллетеням избиратель, участник референдума расписывается за каждый бюллетень. Член участковой комиссии, выдавший избирателю, участнику референдума бюллетень (бюллетени), также расписывается в соответствующей графе списка избирателей, участников референдума. В случае составления списка избирателей, участников референдума в электронном виде допускается применение электронной графической подписи в порядке, определенном при проведении выборов в федеральные органы государственной власти и референдума Российской Федерации Центральной избирательной комиссией Российской Федерации, а при проведении иных выборов, референдумов - избирательной комиссией субъекта Российской Федерации с учетом требований, установленных Центральной избирательной комиссией Российской Федерации.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 6 ст. 64; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 6 ст. 64
fz67:article-64:clause-8:
  id: fz67:article-64:clause-8
  title: "67-ФЗ: п. 8 ст. 64"
  status: source-excerpt
  text: 8. Бюллетень заполняется избирателем, участником референдума в специально оборудованной кабине, ином специально оборудованном месте, где не допускается присутствие других лиц, за исключением случая, указанного в пункте 10 настоящей статьи.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 8 ст. 64; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 8 ст. 64
fz67:article-64:clause-10:
  id: fz67:article-64:clause-10
  title: "67-ФЗ: п. 10 ст. 64"
  status: source-excerpt
  text: 10. Избиратель, участник референдума, не имеющие возможности самостоятельно расписаться в получении бюллетеня или заполнить бюллетень, принять участие в электронном голосовании, вправе воспользоваться для этого помощью другого избирателя, участника референдума, не являющихся членом комиссии, зарегистрированным кандидатом, уполномоченным представителем избирательного объединения, членом или уполномоченным представителем инициативной группы по проведению референдума, уполномоченным представителем по финансовым вопросам, доверенным лицом кандидата, избирательного объединения, наблюдателем. В таком случае избиратель, участник референдума устно извещает комиссию о своем намерении воспользоваться помощью для заполнения бюллетеня, участия в электронном голосовании. При этом в соответствующей (соответствующих) графе (графах) списка избирателей, участников референдума указываются фамилия, имя, отчество, серия и номер паспорта или документа, заменяющего паспорт, лица, оказывающего помощь избирателю, участнику референдума.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 10 ст. 64; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 10 ст. 64
fz67:article-64:clause-9:
  id: fz67:article-64:clause-9
  title: "67-ФЗ: п. 9 ст. 64"
  status: source-excerpt
  text: 9. Если избиратель, участник референдума считает, что при заполнении бюллетеня допустил ошибку, он вправе обратиться к члену комиссии, выдавшему бюллетень, с просьбой выдать ему новый бюллетень взамен испорченного. Член комиссии выдает избирателю, участнику референдума новый бюллетень, делая при этом соответствующую отметку в списке избирателей, участников референдума против фамилии данного избирателя, участника референдума. Испорченный бюллетень, на котором член комиссии с правом решающего голоса делает соответствующую запись и заверяет ее своей подписью, заверяется также подписью секретаря участковой комиссии, после чего такой бюллетень незамедлительно погашается в соответствии с требованиями пункта 3 статьи 68 настоящего Федерального закона. В случае, если избиратель, участник референдума повторно обращаются с просьбой выдать новый бюллетень взамен испорченного, решение о выдаче такого бюллетеня принимается участковой комиссией.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 9 ст. 64; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 9 ст. 64
fz67:article-66:clause-6:
  id: fz67:article-66:clause-6
  title: "67-ФЗ: п. 6 ст. 66"
  status: source-excerpt
  text: 6. Председатель участковой комиссии обязан объявить о том, что члены участковой комиссии будут проводить голосование вне помещения для голосования, не позднее чем за 30 минут до предстоящего выезда (выхода) для проведения такого голосования, а также предложить наблюдателям присутствовать при его проведении.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 6 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 6 ст. 66
fz67:article-66:clause-9:
  id: fz67:article-66:clause-9
  title: "67-ФЗ: п. 9 ст. 66"
  status: source-excerpt
  text: 9. Члены участковой комиссии с правом решающего голоса, проводящие голосование вне помещения для голосования, получают бюллетени и расписываются в их получении. Общее число получаемых бюллетеней не может превышать более чем на 5 процентов число полученных к моменту выезда (выхода) членов комиссии заявлений (устных обращений) (но не менее двух бюллетеней). Голосование вне помещения для голосования проводят не менее двух членов участковой комиссии с правом решающего голоса, которые должны иметь при себе предварительно опечатанный (опломбированный) в участковой комиссии переносной ящик для голосования, необходимое количество бюллетеней установленной формы, предусмотренный в пункте 2 настоящей статьи реестр либо заверенную выписку из него, содержащую необходимые данные об избирателе, участнике референдума и о поступившем заявлении (устном обращении) о предоставлении возможности проголосовать вне помещения для голосования, поступившие заявления избирателей, участников референдума о предоставлении возможности проголосовать вне помещения для голосования, а также необходимые письменные принадлежности (за исключением карандашей) для заполнения избирателем, участником референдума бюллетеня. В список избирателей, участников референдума вносится отметка о том, что к соответствующему избирателю, участнику референдума выехали (вышли) члены участковой комиссии. При проведении выборов высшего должностного лица субъекта Российской Федерации члены участковой комиссии с правом решающего голоса, проводящие голосование вне помещения для голосования, также должны иметь при себе информационные материалы, содержащие сведения, предусмотренные подпунктами "а" - "г" пункта 1.2 статьи 38 настоящего Федерального закона. Если при проведении голосования вне помещения для голосования присутствует не менее двух лиц из лиц, указанных в пункте 14 настоящей статьи, голосование вне помещения для голосования может проводить один член участковой комиссии с правом решающего голоса.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 9 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 9 ст. 66
fz67:article-66:clause-14:
  id: fz67:article-66:clause-14
  title: "67-ФЗ: п. 14 ст. 66"
  status: source-excerpt
  text: 14. При проведении голосования вне помещения для голосования вправе присутствовать наблюдатели. При этом участковая комиссия должна обеспечить равные с выезжающими для проведения голосования членами участковой комиссии с правом решающего голоса возможности прибытия к месту проведения голосования не менее чем двум наблюдателям, назначенным разными кандидатами, избирательными объединениями, одним из субъектов общественного контроля, инициативной группой по проведению референдума, общественными объединениями. При этом лицами, назначенными разными зарегистрированными кандидатами, избирательными объединениями, не признаются наблюдатели, назначенные кандидатом, выдвинутым избирательным объединением, и наблюдатели, назначенные этим избирательным объединением.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 14 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 14 ст. 66
fz67:article-3:clause-3:
  id: fz67:article-3:clause-3
  title: "67-ФЗ: п. 3 ст. 3"
  status: source-excerpt
  text: 3. Участие гражданина Российской Федерации в выборах и референдуме является свободным и добровольным. Никто не вправе оказывать воздействие на гражданина Российской Федерации с целью принудить его к участию или неучастию в выборах и референдуме либо воспрепятствовать его свободному волеизъявлению.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 3 ст. 3; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 3 ст. 3
fz67:article-66:clause-10:
  id: fz67:article-66:clause-10
  title: "67-ФЗ: п. 10 ст. 66"
  status: source-excerpt
  text: 10. Голосование вне помещения для голосования проводится с соблюдением требований, предусмотренных в статье 64 настоящего Федерального закона.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 10 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 10 ст. 66
fz67:article-66:clause-11:
  id: fz67:article-66:clause-11
  title: "67-ФЗ: п. 11 ст. 66"
  status: source-excerpt
  text: 11. На заявлении о предоставлении возможности проголосовать вне помещения для голосования избиратель, участник референдума проставляет серию и номер своего паспорта или документа, заменяющего паспорт гражданина, и своей подписью удостоверяет получение бюллетеня. С согласия избирателя, участника референдума либо по его просьбе серия и номер предъявляемого им паспорта или документа, заменяющего паспорт гражданина, могут быть внесены в указанное заявление членом участковой комиссии с правом решающего голоса. Члены участковой комиссии с правом решающего голоса своими подписями на заявлении удостоверяют факт выдачи бюллетеня. В заявлении также делаются отметки о получении нового бюллетеня взамен испорченного, а в случае получения избирателем, участником референдума двух и более бюллетеней (с учетом вида выборов и совмещения выборов, референдумов) - об общем количестве полученных бюллетеней.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 11 ст. 66; КонсультантПлюс, получено 02.10.2026
  sourceIds:
    - fz67-2026-excerpts
  references:
    - sourceId: fz67-2026-excerpts
      label: Оригинал документа
      locator: п. 11 ст. 66
fz67:article-66:clause-11.1:
  id: fz67:article-66:clause-11.1
  title: "67-ФЗ: п. 11.1 ст. 66"
  status: source-excerpt
  text: 11.1. В случае, если избиратель, участник референдума вследствие инвалидности или по состоянию здоровья не имеет возможности самостоятельно расписаться в получении бюллетеня или заполнить бюллетень, он вправе воспользоваться для этого помощью другого избирателя, участника референдума в порядке, установленном пунктом 10 статьи 64 настоящего Федерального закона.
  source: Федеральный закон от 12.06.2002 № 67-ФЗ (ред. от 26.07.2026); п. 11.1 ст. 66; КонсультантПлюс, получено 02.10.2026
