      blockId: roadmap-morning
      days: each
    - id: voting
      blockId: roadmap-voting
      days: each
    - id: evening
      blockId: roadmap-evening
      days: except-last
    - id: counting
      blockId: roadmap-counting
      days: last
    - id: protocol
      blockId: roadmap-protocol
      days: last
  anytime:
