# Порядок по умолчанию. В tasks.yaml пункт может задать problemSolving: [oral, complaint].
# complaintId в пункте — ID примера из checkbox_items файла жалоб кампании.
default: [oral, complaint, police, prosecutor]
stages:
  oral:
    title: Попросить устно, сославшись на статью
    description: Попросите устранить проблему. Правовые основания этого пункта доступны ниже.
    completedLabel: Попросил устно
    kind: oral
  complaint:
    title: Написать жалобу
    description: Откройте подходящий пример, уточните обстоятельства и подготовьте текст. После подачи отметьте действие выполненным.
    completedLabel: Подана жалоба
    kind: complaint
  police:
    title: Позвонить в полицию
    description: Сообщите обстоятельства проблемы и зафиксируйте время звонка и результат в заметке.
    completedLabel: Позвонил в полицию
    kind: action
  prosecutor:
    title: Обращение в прокуратуру
    description: Подготовьте обращение с обстоятельствами и имеющимися материалами. Отметьте действие после подачи.
    completedLabel: Обращение в прокуратуру подано
    kind: action
