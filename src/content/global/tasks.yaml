roadmap-counting:item-01:
  id: roadmap-counting:item-01
  text: |-
    ⚠️ НЕ ВЫХОДИТЬ ИЗ ЗДАНИЯ ПОСЛЕ 19:30! ПОДСЧЁТ СТРОГО ПОСЛЕДОВАТЕЛЬНЫЙ!

    Главное правило: Каждое подсчитанное число оглашается председателем вслух и СРАЗУ ЖЕ заносится в УФП на стене! 

    Подсчёт голосов начинается сразу после закрытия участка и выполняется БЕЗ ПЕРЕРЫВОВ.
  lawIds:
    - fz67:article-68:clause-2
  sourceIds: []
  media: []
roadmap-counting:item-02:
  id: roadmap-counting:item-02
  text: "Шаг 1. Гашение бюллетеней: Считают неиспользованные, оглашают число, отрезают левый нижний угол. Формула: Полученные бюллетени - Подсчитанная явка = Гашеное кол-во."
  lawIds:
    - fz67:article-68:clause-4
  sourceIds: []
  media: []
roadmap-counting:item-03:
  id: roadmap-counting:item-03
  text: "Шаг 2. Списки избирателей: Считают подписи, подписывают страницы, оглашают цифры, брошюруют том, убирают в сейф."
  lawIds:
    - fz67:article-68:clause-5
    - fz67:article-68:clause-6
    - fz67:article-68:clause-7
  sourceIds: []
  media: []
roadmap-counting:item-05:
  id: roadmap-counting:item-05
  text: |-
    Шаг 3. Вскрытие сейф-пакетов и ящиков:

    Проверка целостности и сверка номеров пакетов с Актами! (При повреждении — недействительны по акту!)
